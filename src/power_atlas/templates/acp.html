{% extends "base.html" %}
{% block content %}
<div class="topbar">
  <a class="acp-back" href="/">&#8592; PowerAtlas</a>
  <span class="acp-title">ACP prototype</span>
  <div class="topbar-spacer"></div>
  <div class="topbar-cluster">
    <!-- How full the session's context window is. Hidden until the agent has
         reported it, which it does once per turn — an empty bar and "0%" would
         both claim a measurement that has not been taken. -->
    <span class="acp-context" id="acpContext" hidden
          title="Context window used by this session">
      <span class="acp-context-track"><span class="acp-context-fill" id="acpContextFill"></span></span>
      <span class="acp-context-label" id="acpContextLabel"></span>
    </span>
    <span class="acp-status" id="acpStatus" data-state="connecting">connecting…</span>
  </div>
</div>

<!-- The session browser. Rendered client-side from GET /api/acp/sessions, never
     by Jinja: the rail pages and filters after first paint, so a server-rendered
     list would have to come back as markup and be written through a sink this
     page forbids. Empty here and filled by renderRail(). Phase 5b owns the
     two-pane shell and the CSS; this markup is deliberately a sibling of
     .acp-page rather than a wrapper around it, so the existing flex layout is
     untouched until the phase that owns it.

     `hidden` — READ BEFORE REMOVING. This element is a flex child of a body that
     is `display:flex; flex-direction:column` (style.css:23) inside
     `html, body { height:100%; overflow:hidden }` (style.css:2), and style.css
     carries **no .acp-rail rule at all** until 5b writes one. With none, the
     rail's flex `min-height` resolves to `auto` — content height, unshrinkable —
     while `.acp-page { flex:1; min-height:0 }` (style.css:452) has `flex-basis:0`
     and absorbs the entire squeeze. Measured in Chromium against this template
     and that stylesheet with twelve workspaces: at 1280x800 the rail takes
     567 px, `.acp-page` falls from ~752 px to 185 px and `#acpTranscript` to
     26 px, with `body.scrollHeight` 890 against an 800 px viewport that
     `overflow:hidden` will not scroll; at 390x844 the rail is 1007 px tall and
     the transcript, the prompt, Send, New session and Close all sit below the
     fold with no scrollbar. So the rail stays inert here and the conversation
     keeps the layout it had before 5a.

     **Phase 5b deletes this attribute** as the first act of its exit criterion
     "Two-pane at >=768 px; drill-down below, verified at 390 px and 768 px",
     once style.css gives .acp-rail a bounded height. Deleting it before that
     re-ships the collapse. `tests/acp_page.test.mjs` pins the attribute in
     "the rail stays inert until Phase 5b gives it a layout"; that check is 5b's
     to retire, together with the attribute, after the 390/768 verification. -->
<aside class="acp-rail" id="acpRail" aria-label="Sessions" hidden>
  <div class="acp-rail-head">
    <input class="acp-rail-search" id="acpRailSearch" type="text" spellcheck="false"
           placeholder="Filter the sessions below"
           aria-label="Filter the sessions listed below">
    <button class="acp-btn" id="acpRailReload" type="button">Refresh</button>
  </div>
  <div class="acp-rail-status" id="acpRailStatus" role="status" aria-live="polite"></div>
  <div class="acp-rail-groups" id="acpRailGroups"></div>
  <button class="acp-btn acp-rail-more" id="acpRailMore" type="button" hidden>More workspaces</button>
</aside>

<div class="acp-page">
  <div class="acp-toolbar">
    <button class="acp-btn" id="acpNew" type="button">New session</button>
    <!-- Every session created here is a permanent entry in the real kiro-cli
         store, and under -a the agent's tools run for real in whatever
         directory it names, so the cwd is worth being explicit about rather
         than implicit. Blank means the agent's own neutral cwd, which lights
         up no real workspace in the dashboard's process scan. -->
    <input class="acp-btn acp-input" id="acpCwd" type="text" spellcheck="false"
           placeholder="session directory — blank for the agent's neutral cwd"
           aria-label="Directory to create the session against">
    <button class="acp-btn" id="acpReconnect" type="button" hidden>Reconnect</button>
    <button class="acp-btn" id="acpReload" type="button" hidden>Reload page</button>
    <!-- The lever the memory budget rests on: each live session costs 5
         processes and ~254 MB of MCP servers inside the agent, and nothing
         sweeps idle ones. plans/ROADMAP.md carries the cost model. -->
    <button class="acp-btn acp-danger" id="acpClose" type="button" hidden>Close session</button>
    <span class="acp-sid" id="acpSid"></span>
  </div>
  <div class="acp-transcript" id="acpTranscript" role="log" aria-live="polite"
       aria-label="Conversation"></div>
  <div class="acp-composer">
    <textarea class="acp-prompt" id="acpPrompt" rows="2" spellcheck="false"
              placeholder="Prompt the agent — Enter sends, Shift+Enter for a new line"
              aria-label="Prompt"></textarea>
    <button class="acp-btn acp-send" id="acpSend" type="button" disabled>Send</button>
    <!-- Only during a turn. A stop control that is present and inert for the
         whole idle time is indistinguishable from one that has stopped
         working, and a turn under -a can run tools for minutes. -->
    <button class="acp-btn acp-danger acp-send" id="acpStop" type="button" hidden>Stop</button>
  </div>
  <div class="acp-log" id="acpLog" role="log" aria-live="polite" aria-label="ACP transport log"></div>
</div>

<script nonce="{{ csp_nonce }}">
// This page is served with a nonce-based Content-Security-Policy, so this tag
// runs and an injected script element or inline handler does not. The nonce is
// one half of the defense and the no-innerHTML rule below is the other: the
// policy stops script that reaches the markup, the rule stops it reaching it.
//
// Nothing on this page is written through innerHTML: every node below is built
// with createElement + textContent. Agent output is attacker-influenced (repo
// files, fetched pages, commit messages) and the agent runs trust-all-tools,
// so an injected script here could drive /ws/acp itself and pass the origin
// check by genuinely being same-origin. Every chunk this page renders now
// comes from the agent, so the rule established in 3a is live from here on.
// index.html's _escHtml is the alternative where markup is unavoidable — but
// note it escapes & < > and *not* ", so it is safe for text nodes only.
//
// This page also uses plain listeners rather than hx-* attributes, so it never
// needs htmx.process(). Add that call if any hx-* markup ever appears here:
// static/htmx.min.js binds handlers at DOMContentLoaded and nowhere else.
(function () {
  var ACP_TOKEN = {{ acp_token | tojson }};
  var ACP_SID = {{ sid | tojson }};
  // Non-empty when web.py's guarded import of acp.py failed. The whole point of
  // guarding that import is that the rest of the dashboard keeps working, which
  // only pays off if this page says why it is dead instead of looking merely
  // disconnected.
  var ACP_ERROR = {{ acp_error | tojson }};

  var statusEl = document.getElementById('acpStatus');
  var logEl = document.getElementById('acpLog');
  var sidEl = document.getElementById('acpSid');
  var newBtn = document.getElementById('acpNew');
  var cwdInput = document.getElementById('acpCwd');
  var reconnectBtn = document.getElementById('acpReconnect');
  var reloadBtn = document.getElementById('acpReload');
  var transcriptEl = document.getElementById('acpTranscript');
  var promptInput = document.getElementById('acpPrompt');
  var sendBtn = document.getElementById('acpSend');
  var stopBtn = document.getElementById('acpStop');
  var closeBtn = document.getElementById('acpClose');
  var contextEl = document.getElementById('acpContext');
  var contextFill = document.getElementById('acpContextFill');
  var contextLabel = document.getElementById('acpContextLabel');
  var railSearch = document.getElementById('acpRailSearch');
  var railReload = document.getElementById('acpRailReload');
  var railStatus = document.getElementById('acpRailStatus');
  var railGroupsEl = document.getElementById('acpRailGroups');
  var railMore = document.getElementById('acpRailMore');
  var ws = null;
  // Whether the most recent attempt ever reached onopen. A close without one
  // means the handshake was rejected, which is a different failure from a
  // socket that lived and then dropped, and needs a different recovery.
  var opened = false;
  // ACP_SID is only ever the *initial* value, from ?sid= in the URL. Every
  // later read must be of `sessionId`, which `session` frames update: a
  // reconnect that subscribed with the baked-in id would resubscribe to
  // whatever the URL said at render time, replaying that conversation over
  // the live one — or, with no ?sid= at all, send no subscribe and leave a
  // connected-looking page whose next prompt is refused `not_subscribed`.
  var sessionId = ACP_SID || null;
  // The message body consecutive agent chunks are appended to. Null between
  // turns, so the next chunk opens a new bubble instead of extending the old.
  var agentBody = null;
  // Whether *this* connection has been answered with a `session` frame, which
  // is the only thing the server sends when it adds a socket to a session's
  // subscribers. It is the page's read on whether a `session_closed` is coming:
  // a subscribed socket is in the fan-out and will be told, an unsubscribed one
  // never will. Reset by connect(), because a socket that dropped took its
  // subscription with it and the new one holds nothing until it is answered.
  var subscribed = false;
  // True while a `history` frame is being fed back through handle(). The
  // frames in it are real and render normally; what would be wrong is
  // narrating a replay into the transport log as if it were live traffic.
  var replaying = false;
  // Whether the server holds a turn for this session. Never inferred from a
  // replayed turn marker — the buffer evicts those; the `session` frame
  // carries the authoritative value.
  var turnActive = false;
  // The prompt handed to a `send` that has not yet been acknowledged by a
  // turn starting. Held so a refusal can put it back in the textarea.
  var pendingPrompt = null;
  // toolCallId -> the elements a later `tool_update` rewrites in place, so a
  // call that runs then completes is one row rather than three.
  var toolRows = Object.create(null);
  // Session ids a `load` has already been tried for on this socket. Reset per
  // connection, because the reason a load is worth retrying is a server that
  // restarted. Without it the one refusal that matters — "active in another
  // process" — becomes a retry loop against a session that will keep refusing.
  var loadTried = Object.create(null);
  // The session id a `load` is outstanding for, or null. The agent answers
  // with the whole conversation at once and says nothing before that, so
  // without a label the page is blank and looks broken for the duration.
  var loadingSid = null;
  // True once a load has failed on this socket. The socket itself is healthy,
  // so none of the close handlers run and none of the recovery buttons appear;
  // without this the page is a dead end whose only pressable control is Enter,
  // which reaches the server and is refused with advice for a different case.
  var loadFailed = false;

  // ---- the session rail ------------------------------------------------
  // D16: ten workspaces shown with a show-more, three sessions inside each
  // with its own show-more. The two page sizes are the defaults the listing
  // endpoint already uses; they are sent explicitly anyway, because the rail's
  // layout depends on them and a server-side default change should not silently
  // reshape the page.
  var RAIL_GROUP_SIZE = 10;
  var RAIL_SESSION_SIZE = 3;
  // The three states GET /api/acp/sessions can report (D17), as a closed set.
  // The value comes off the wire and ends up in a class name and a data
  // attribute, both of which are attribute sinks — so it is narrowed to one of
  // these literals first, the same discipline `addMessage` applies to `role`.
  //
  // `Object.create(null)`, not a literal, and that is the whole of what makes
  // the set closed: on a literal every `Object.prototype` key is a hit, so
  // `RAIL_AVAILABILITY['constructor'] || 'available'` answers the Object
  // constructor and `acp-rail-row-function Object() { [native code] }` reaches
  // className, dataset.availability and — via the label map, which misses —
  // an aria-label reading the literal "undefined". `__proto__` and `toString`
  // do the same. Same idiom, same reason, as `toolRows` and `loadTried`.
  var RAIL_AVAILABILITY = Object.create(null);
  RAIL_AVAILABILITY.available = 'available';
  RAIL_AVAILABILITY.held = 'held';
  RAIL_AVAILABILITY.locked = 'locked';
  var RAIL_AVAILABILITY_LABEL = Object.create(null);
  RAIL_AVAILABILITY_LABEL.available = 'available';
  RAIL_AVAILABILITY_LABEL.held = 'held by this PowerAtlas';
  RAIL_AVAILABILITY_LABEL.locked = 'in use by another process — cannot be opened here';
  // Every group fetched so far, in fetch order, each carrying the sessions
  // fetched for it so far. Accumulated rather than replaced: "show more" is
  // additive on both axes, and a page that dropped what it had would lose the
  // row the user was reading towards.
  var railGroups = [];
  // cwd -> the entry in `railGroups` for it, so a workspace that comes back on
  // a later page merges into the copy on screen instead of being drawn beside
  // it. Prefixed and prototype-less for the reason above: the key is a path off
  // the wire.
  var railGroupsByCwd = Object.create(null);
  var railGroupPage = 0;
  var railGroupTotal = 0;
  var railHasMore = false;
  var railFilter = '';
  var railBusy = false;
  // The node the user last activated in the rail, so the rebuild that follows
  // can put focus back on it. renderRail() empties and recreates every node it
  // owns, which drops focus to <body> — harmless for the filter box, which
  // lives outside that container, and not harmless for a row or a show-more,
  // where it throws a keyboard or screen-reader user out of the rail mid-task.
  // That is the same population the `locked` row's `disabled` exists for.
  var railFocus = null;

  if (sessionId) sidEl.textContent = 'session ' + sessionId;

  function setState(state, text) {
    statusEl.dataset.state = state;
    statusEl.textContent = text;
  }

  function logLine(kind, text) {
    if (replaying) return;
    var row = document.createElement('div');
    row.className = 'acp-log-line acp-log-' + kind;
    var when = document.createElement('span');
    when.className = 'acp-log-time';
    when.textContent = new Date().toLocaleTimeString();
    var body = document.createElement('span');
    body.className = 'acp-log-body';
    body.textContent = text;
    row.appendChild(when);
    row.appendChild(body);
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function wsUrl() {
    // Derived from location.host, never a hardcoded port: config.py defaults
    // `port` to 0 (OS-assigned), so any literal here would be wrong on most
    // launches while looking right on the machine it was written on.
    var scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return scheme + '//' + location.host + '/ws/acp?t=' + encodeURIComponent(ACP_TOKEN);
  }

  // Returns whether the frame actually left. Callers holding something the
  // user typed need to know: silently reporting a drop into a 120 px log strip
  // while clearing the textarea loses the prompt with no way to get it back.
  function send(type, payload, sid) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      logLine('error', 'not connected — nothing sent');
      return false;
    }
    ws.send(JSON.stringify({
      type: type,
      sessionId: sid || null,
      payload: payload || {}
    }));
    logLine('out', '→ ' + type);
    return true;
  }

  function setPending(pending) {
    // The button is the only thing stopping a second session/new landing while
    // the first is still in flight, and each one costs ~254 MB and is a
    // permanent entry in the real kiro-cli store. Creation takes ~5.4 s for the
    // first session of an agent process and ~2.5 s for each one after, so the
    // window is wide enough to double-click through by accident.
    newBtn.disabled = pending;
    newBtn.textContent = pending ? 'Creating…' : 'New session';
  }

  function setLoading(sid) {
    loadingSid = sid || null;
    // Only the label moves. The socket really is open either way, and calling
    // it anything else would make a slow load read as a dropped connection —
    // which has its own recovery button and would be the wrong one to press.
    if (ws && ws.readyState === WebSocket.OPEN) {
      setState('open', loadingSid ? 'loading session…' : 'connected');
    }
  }

  function setTurn(active) {
    turnActive = active;
    sendBtn.disabled = active || !sessionId || loadFailed;
    sendBtn.textContent = active ? 'Working…' : 'Send';
    sendBtn.hidden = active;
    stopBtn.hidden = !active;
    stopBtn.disabled = false;
    stopBtn.textContent = 'Stop';
    // Closing under a live turn is refused by the server — the outstanding
    // session/prompt would sit on a session the agent no longer has for the
    // whole of its ten-minute ceiling — so the button says so by being off.
    closeBtn.hidden = !sessionId;
    closeBtn.disabled = active || !sessionId;
    closeBtn.textContent = 'Close session';
  }

  function setContext(percent) {
    // Numeric or nothing. The server clamps this to 0-100 and rounds it, and
    // the check is repeated here because the value ends up as a CSS width:
    // that is an attribute sink, and the rule on this page is that nothing
    // agent-derived reaches one. A number that survives both checks is written
    // by this line, not by the agent.
    if (typeof percent !== 'number' || !isFinite(percent) ||
        percent < 0 || percent > 100) {
      contextEl.hidden = true;
      return;
    }
    contextEl.hidden = false;
    contextFill.style.width = percent + '%';
    contextLabel.textContent = 'context ' + percent + '%';
  }

  function reportLoadFailure() {
    // The recovery exists — back to the dashboard, or reload — but nothing
    // said so, and the two buttons that offer it are unhidden only from
    // `onclose`, which does not fire here because the socket is fine.
    loadFailed = true;
    setTurn(false);
    setState('closed', 'session not loaded');
    reloadBtn.hidden = false;
    addMessage('note', 'this session was not loaded, so there is nothing to '
      + 'prompt. Reload the page to try the load again, or go back to '
      + 'PowerAtlas and pick another session. Restarting PowerAtlas releases '
      + 'every session its agent is still holding.');
  }

  function stuckToBottom() {
    // Measured before the append, not after: once the node is in the DOM the
    // pane is by definition no longer scrolled to the bottom, so a check made
    // afterwards would never stick and a long answer would scroll away under
    // anyone reading the top of it.
    return transcriptEl.scrollHeight - transcriptEl.scrollTop
             - transcriptEl.clientHeight < 60;
  }

  // `role` is a literal at every call site, and `appendChunk` narrows the one
  // value that comes off the wire to a fixed pair before it gets here. That is
  // deliberate: this is the only place a class name is built by concatenation,
  // and a payload-derived one would be an attribute sink for a string the
  // agent wrote.
  function addMessage(role, text) {
    var stick = stuckToBottom();
    var row = document.createElement('div');
    row.className = 'acp-msg acp-msg-' + role;
    var who = document.createElement('span');
    who.className = 'acp-msg-role';
    who.textContent = role === 'user' ? 'you'
      : (role === 'agent' ? 'agent' : (role === 'error' ? 'error' : ''));
    var body = document.createElement('div');
    body.className = 'acp-msg-body';
    body.textContent = text;
    row.appendChild(who);
    row.appendChild(body);
    transcriptEl.appendChild(row);
    if (stick) transcriptEl.scrollTop = transcriptEl.scrollHeight;
    return body;
  }

  function addToolCall(payload) {
    // Every class name below is a literal. `status`, `kind` and `title` are
    // agent-authored and reach the page only through textContent — under -a
    // there is no permission gate, so this string can be anything, and it is
    // the one thing an operator has to read to know what ran.
    var id = payload.toolCallId;
    var known = id ? toolRows['t:' + id] : null;
    if (known) {
      known.status.textContent = payload.status || 'update';
      if (payload.command && !known.body.querySelector('.acp-tool-cmd')) {
        known.body.appendChild(commandBlock(payload));
      }
      return;
    }

    var stick = stuckToBottom();
    // A tool call ends the open agent bubble: the prose after it is a new
    // paragraph, not a continuation of the sentence the call interrupted.
    agentBody = null;

    var row = document.createElement('div');
    row.className = 'acp-msg acp-msg-tool';
    var who = document.createElement('span');
    who.className = 'acp-msg-role';
    who.textContent = 'tool';
    var body = document.createElement('div');
    body.className = 'acp-msg-body';

    var head = document.createElement('div');
    head.className = 'acp-tool-head';
    var name = document.createElement('span');
    name.className = 'acp-tool-name';
    name.textContent = payload.title || payload.kind || 'tool call';
    head.appendChild(name);
    if (payload.kind && payload.title) {
      var kind = document.createElement('span');
      kind.className = 'acp-tool-kind';
      kind.textContent = payload.kind;
      head.appendChild(kind);
    }
    var status = document.createElement('span');
    status.className = 'acp-tool-status';
    status.textContent = payload.status || 'started';
    head.appendChild(status);
    body.appendChild(head);

    if (payload.command) body.appendChild(commandBlock(payload));

    row.appendChild(who);
    row.appendChild(body);
    transcriptEl.appendChild(row);
    if (id) toolRows['t:' + id] = { status: status, body: body };
    if (stick) transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  function commandBlock(payload) {
    var wrap = document.createElement('div');
    var cmd = document.createElement('div');
    cmd.className = 'acp-tool-cmd';
    cmd.textContent = payload.command;
    wrap.appendChild(cmd);
    if (payload.commandTruncated) {
      // The clip is stated rather than silent: a command that ends mid-word
      // and looks complete is worse than no rendering at all.
      var more = document.createElement('div');
      more.className = 'acp-tool-more';
      more.textContent = 'showing the first ' + payload.command.length +
                         ' of ' + payload.commandLength + ' characters';
      wrap.appendChild(more);
    }
    return wrap;
  }

  function appendChunk(role, text) {
    if (role === 'agent' && agentBody) {
      var stick = stuckToBottom();
      agentBody.textContent += text;
      if (stick) transcriptEl.scrollTop = transcriptEl.scrollHeight;
      return;
    }
    var body = addMessage(role, text);
    agentBody = role === 'agent' ? body : null;
  }

  function clearTranscript() {
    // Emptying by textContent rather than innerHTML: same effect, and it keeps
    // the no-innerHTML rule true of every line on this page without exception.
    transcriptEl.textContent = '';
    agentBody = null;
    toolRows = Object.create(null);
  }

  function railUrl(params) {
    var qs = [];
    for (var key in params) {
      var value = params[key];
      if (value === null || value === undefined || value === '') continue;
      qs.push(encodeURIComponent(key) + '=' + encodeURIComponent(value));
    }
    return '/api/acp/sessions' + (qs.length ? '?' + qs.join('&') : '');
  }

  function railFetch(params) {
    // `no-store` for the same reason the endpoint sends it: availability is a
    // liveness reading with a lifetime of seconds, and a cached `available` for
    // a session another process has taken is exactly the wrong thing to keep.
    return fetch(railUrl(params), { cache: 'no-store', credentials: 'same-origin' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      });
  }

  function railFailed(what, err) {
    railBusy = false;
    var why = (err && err.message) || String(err);
    railStatus.textContent = what + ' (' + why + ')';
    logLine('error', 'session list: ' + why);
  }

  function railSummary() {
    // Both loaders end here, so the status never keeps a "loading…" line that
    // the answer has already made false.
    railStatus.textContent = railGroups.length
      ? railGroups.length + ' of ' + railGroupTotal + ' workspaces'
      : 'no sessions found';
  }

  function railMergeSessions(group, rows) {
    // By id, because the same reorder that repeats a workspace repeats the
    // sessions inside it: a session that moved to the front of its workspace
    // between two pages is legitimately in both answers.
    var seen = Object.create(null);
    var i;
    for (i = 0; i < group.sessions.length; i++) {
      seen['s:' + group.sessions[i].id] = true;
    }
    for (i = 0; i < rows.length; i++) {
      if (seen['s:' + rows[i].id]) continue;
      seen['s:' + rows[i].id] = true;
      group.sessions.push(rows[i]);
    }
  }

  function railMergeGroup(incoming) {
    // Workspaces come back recency-ordered and the rail's own purpose reorders
    // them — opening a session and running a turn moves that workspace towards
    // the front — so "More workspaces" after any activity can legitimately
    // answer with a workspace already on screen. Pushed blind, that workspace
    // is drawn twice, and each copy then carries its own `session_page`, so its
    // per-group show-more extends only one of them.
    var key = 'c:' + incoming.cwd;
    var group = railGroupsByCwd[key];
    var rows = incoming.sessions || [];
    if (!group) {
      incoming.sessions = [];
      railGroupsByCwd[key] = incoming;
      railGroups.push(incoming);
      railMergeSessions(incoming, rows);
      return;
    }
    railMergeSessions(group, rows);
    if (typeof incoming.total === 'number') group.total = incoming.total;
    // Paging state only ever moves forward. A repeat on a later group page
    // carries `session_page: 1`, and adopting it would rewind a workspace the
    // user had already paged into and re-offer rows that are already drawn.
    if ((incoming.session_page || 1) > (group.session_page || 1)) {
      group.session_page = incoming.session_page;
      group.has_more = !!incoming.has_more;
    }
  }

  function loadGroupPage(page) {
    // One request in flight at a time. Both show-more buttons and Refresh reach
    // this, and two overlapping pages would interleave into `railGroups` in
    // whatever order they answered. A click dropped here is not announced
    // separately: the status line below is already saying the rail is loading,
    // which is what the second click is being refused for.
    if (railBusy) return;
    railBusy = true;
    railStatus.textContent = page > 1 ? 'loading more workspaces…' : 'loading sessions…';
    railFetch({
      group_page: page,
      group_size: RAIL_GROUP_SIZE,
      session_page: 1,
      session_size: RAIL_SESSION_SIZE
    }).then(function (data) {
      railBusy = false;
      // Page 1 is a reload, every later page is an append.
      if (page === 1) {
        railGroups = [];
        railGroupsByCwd = Object.create(null);
      }
      var groups = (data && data.groups) || [];
      for (var i = 0; i < groups.length; i++) railMergeGroup(groups[i]);
      railGroupPage = page;
      railHasMore = !!(data && data.has_more);
      railGroupTotal = (data && data.group_total) || railGroups.length;
      railSummary();
      renderRail();
    }).catch(function (err) {
      railFailed('could not load the session list', err);
    });
  }

  function loadGroupSessions(group) {
    if (railBusy) return;
    railBusy = true;
    // Said out loud for the same reason the group page says it: without a line
    // here the per-group show-more is silent both when it works and when it is
    // dropped for a request already in flight.
    railStatus.textContent = 'loading more sessions…';
    var next = (group.session_page || 1) + 1;
    // `cwd` selects one workspace and bypasses the group axis, so paging deep
    // into a 208-session workspace costs that workspace rather than the page.
    railFetch({
      cwd: group.cwd,
      session_page: next,
      session_size: RAIL_SESSION_SIZE
    }).then(function (data) {
      railBusy = false;
      var got = ((data && data.groups) || [])[0];
      if (!got) {
        // The workspace answered nothing — it was hidden, or emptied since the
        // page loaded. Stop offering more rather than looping on the button.
        group.has_more = false;
        railSummary();
        renderRail();
        return;
      }
      railMergeSessions(group, got.sessions || []);
      group.session_page = next;
      group.has_more = !!got.has_more;
      if (typeof got.total === 'number') group.total = got.total;
      railSummary();
      renderRail();
    }).catch(function (err) {
      railFailed('could not load more sessions', err);
    });
  }

  function railAvailability(value) {
    return RAIL_AVAILABILITY[value] || 'available';
  }

  function railWhen(value) {
    // The store's timestamps are ISO strings. Anything else is shown as it came
    // rather than parsed into an `Invalid Date`, which would read as a defect in
    // the rail rather than in the record.
    var text = String(value || '');
    if (text.length >= 16 && text.charAt(10) === 'T') {
      return text.slice(0, 10) + ' ' + text.slice(11, 16);
    }
    return text;
  }

  function railMatches(group, session) {
    if (!railFilter) return true;
    // Workspace name and path are part of the haystack: "the sessions in
    // nrf_tool" is the query a rail grouped by workspace invites.
    var hay = ((session.title || '') + ' ' + (group.name || '') + ' ' +
               (group.cwd || '')).toLowerCase();
    return hay.indexOf(railFilter) !== -1;
  }

  function railRowNode(session) {
    var state = railAvailability(session.availability);
    var locked = state === 'locked';
    var row = document.createElement('button');
    // Class names are literals plus the narrowed state, never the raw field.
    row.className = 'acp-rail-row acp-rail-row-' + state +
                    (session.id === sessionId ? ' acp-rail-row-current' : '');
    row.type = 'button';
    row.dataset.sid = session.id;
    row.dataset.availability = state;
    // Greyed is a colour; disabled is the only version of "not selectable" that
    // a keyboard and a screen reader also get. D17: a session locked by a live
    // foreign process cannot be loaded, and offering it costs a round trip and
    // an error the user cannot act on.
    row.disabled = locked;

    var dot = document.createElement('span');
    dot.className = 'acp-avail acp-avail-' + state;
    // The dot carries no text, so without this it is an indicator with no
    // accessible name.
    dot.setAttribute('aria-label', RAIL_AVAILABILITY_LABEL[state]);
    dot.title = RAIL_AVAILABILITY_LABEL[state];
    row.appendChild(dot);

    var title = document.createElement('span');
    title.className = 'acp-rail-row-title';
    // 185 of the real store's 1,210 sessions carry neither a title nor a first
    // prompt to fall back to, so a blank one is a normal reading and not an
    // edge case; a row with nothing in it is unclickable in practice.
    title.textContent = String(session.title || '').trim() || 'untitled session';
    row.appendChild(title);

    var when = document.createElement('span');
    when.className = 'acp-rail-row-when';
    when.textContent = railWhen(session.updated_at);
    row.appendChild(when);

    row.addEventListener('click', function () {
      // A browser fires no click on a disabled button; this guard covers
      // everything else that can reach the handler, including a later refactor
      // that stops drawing the row as one.
      if (locked) return;
      railFocus = { sid: session.id };
      selectSession(session.id);
    });
    return row;
  }

  function railLastRow(root) {
    var rows = root.querySelectorAll('.acp-rail-row');
    return rows.length ? rows[rows.length - 1] : null;
  }

  function railRestoreFocus() {
    var want = railFocus;
    railFocus = null;
    if (!want) return;
    var node = null;
    var i;
    if (want.sid) {
      var rows = railGroupsEl.querySelectorAll('.acp-rail-row');
      for (i = 0; i < rows.length; i++) {
        if (rows[i].dataset.sid === want.sid) { node = rows[i]; break; }
      }
    } else if (want.cwd) {
      var groups = railGroupsEl.querySelectorAll('.acp-rail-group');
      for (i = 0; i < groups.length; i++) {
        if (groups[i].dataset.cwd !== want.cwd) continue;
        // The button the user pressed is gone once the workspace is fully
        // shown, so fall back to the last row — which is where it stood, and
        // is the row the press just revealed.
        node = groups[i].querySelector('.acp-rail-group-more') ||
               railLastRow(groups[i]);
        break;
      }
    } else if (want.more) {
      // This button is outside the rebuilt container, so it keeps focus by
      // itself; the one case that needs restoring is the render that hides it,
      // which is exactly the render that brought the last page in.
      node = railMore.hidden ? railLastRow(railGroupsEl) : railMore;
    }
    if (node && node.focus) node.focus();
  }

  function railGroupNode(group, sessions) {
    var wrap = document.createElement('div');
    wrap.className = 'acp-rail-group';
    wrap.dataset.cwd = group.cwd;

    var head = document.createElement('div');
    head.className = 'acp-rail-group-head';
    var name = document.createElement('span');
    name.className = 'acp-rail-group-name';
    name.textContent = group.name || group.cwd;
    // The folder name is what fits in the rail; the full path is the only thing
    // that tells two workspaces with the same one apart.
    name.title = group.cwd;
    head.appendChild(name);
    var count = document.createElement('span');
    count.className = 'acp-rail-group-count';
    // Under a filter the group draws only the rows that matched, so counting the
    // loaded set here would contradict what is directly beneath it — a header
    // reading "3 of 5" above a single row. `sessions` is the filtered list this
    // node is actually built from, which is the only count that can agree.
    count.textContent = railFilter
      ? sessions.length + ' matching'
      : group.sessions.length + ' of ' + group.total;
    head.appendChild(count);
    wrap.appendChild(head);

    for (var i = 0; i < sessions.length; i++) {
      wrap.appendChild(railRowNode(sessions[i]));
    }

    if (group.has_more) {
      var more = document.createElement('button');
      more.className = 'acp-btn acp-rail-group-more';
      more.type = 'button';
      more.textContent = 'More in ' + (group.name || 'this workspace');
      more.addEventListener('click', function () {
        railFocus = { cwd: group.cwd };
        loadGroupSessions(group);
      });
      wrap.appendChild(more);
    }
    return wrap;
  }

  function renderRail() {
    // Emptied by textContent rather than innerHTML: same effect, and it keeps
    // the no-innerHTML rule true of every line on this page without exception.
    railGroupsEl.textContent = '';
    var shown = 0;
    for (var i = 0; i < railGroups.length; i++) {
      var group = railGroups[i];
      var sessions = [];
      var all = group.sessions || [];
      for (var j = 0; j < all.length; j++) {
        if (railMatches(group, all[j])) sessions.push(all[j]);
      }
      // A workspace with nothing left after the filter is not drawn at all —
      // an empty group header is noise in a list whose whole job is narrowing.
      if (sessions.length === 0) continue;
      railGroupsEl.appendChild(railGroupNode(group, sessions));
      shown += sessions.length;
    }
    if (shown === 0) {
      var empty = document.createElement('div');
      empty.className = 'acp-rail-empty';
      empty.textContent = railFilter
        ? 'nothing listed matches that — the filter narrows the sessions already '
          + 'loaded, so load more workspaces to widen it'
        : 'no sessions to show';
      railGroupsEl.appendChild(empty);
    }
    railMore.hidden = !railHasMore;
    railRestoreFocus();
  }

  function selectSession(sid) {
    if (!sid || sid === sessionId) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      logLine('error', 'not connected — reconnect before opening a session');
      return;
    }
    sessionId = sid;
    // A new session on the same socket: nothing about the old one survives, and
    // `subscribed` in particular must not, or a `close_in_progress` for this one
    // would take the wrong arm.
    subscribed = false;
    // Adoption is per *selection*, not per connection. `connect()` resets this
    // whole map because a socket that dropped took its subscription with it,
    // and before the rail existed one socket held one session so that was the
    // only reset needed. The rail makes several sessions per socket normal: A,
    // then B, then A again is an ordinary sequence, and Phase 2's idle sweeper
    // can reclaim A while the user is working in B. Without this delete the
    // second `unknown_session` for A sends no `load` at all — the transcript
    // gets a bare `[unknown_session]` and not even the recovery note, because
    // `reportLoadFailure` fires off a `meta pending:'load'` that never arrives.
    delete loadTried['s:' + sid];
    loadFailed = false;
    setLoading(null);
    clearTranscript();
    setContext(null);
    setTurn(false);
    sidEl.textContent = 'session ' + sid;
    history.replaceState(null, '',
      location.pathname + '?sid=' + encodeURIComponent(sid));
    // `subscribe` first. The server answers `unknown_session` for a session it
    // does not hold, and the error branch above turns that into a `load` from
    // the agent's own store — the same path the dashboard's row action opens,
    // reused rather than duplicated here.
    send('subscribe', {}, sid);
    logLine('info', 'opening ' + sid + ' from the session list');
    renderRail();
  }

  function sendPrompt() {
    var text = promptInput.value;
    if (!text.trim()) return;
    if (loadFailed) {
      // Send is disabled here but Enter is not, and this gate used to fall
      // through to the server, which answered "create a new one" — the one
      // thing the user was trying to avoid by opening an existing session.
      logLine('error', 'the session was not loaded — nothing sent. Reload the '
                       + 'page to try the load again.');
      return;
    }
    if (!sessionId) {
      logLine('error', 'no session yet — create one first');
      return;
    }
    if (turnActive) {
      // The button is disabled during a turn but Enter is not, and a prompt
      // sent here comes back refused `turn_in_progress`.
      logLine('error', 'still answering the previous prompt — not sent');
      return;
    }
    if (!send('prompt', { prompt: text }, sessionId)) return;
    pendingPrompt = text;
    promptInput.value = '';
  }

  function restorePendingPrompt(why) {
    var text = pendingPrompt;
    pendingPrompt = null;
    if (text === null) return;
    // Only if the box is still empty: the user may have started typing the
    // next thing while the refusal was in flight, and overwriting that would
    // be the same loss in the other direction.
    if (promptInput.value) {
      addMessage('note', 'the refused prompt is not restored — the box already '
                         + 'has something in it: ' + text);
      return;
    }
    promptInput.value = text;
    logLine('info', 'prompt restored to the box (' + why + ')');
  }

  function handle(frame) {
    var type = frame && frame.type;
    var payload = (frame && frame.payload) || {};
    if (type === 'meta' && payload.connected) {
      setState('open', 'connected');
      logLine('info', '← meta: server ack (max frame ' + payload.maxMessageBytes +
                      ' bytes, max sockets ' + payload.maxConnections + ')');
      return;
    }
    if (type === 'meta' && payload.pending === 'new') {
      setPending(true);
      logLine('info', 'creating a session — the agent takes several seconds');
      return;
    }
    if (type === 'meta' && payload.pending === 'load') {
      setLoading(frame.sessionId || sessionId);
      // The ceiling comes off the wire rather than being written here, and it
      // is said at all because a slow load and a wedged one look identical
      // until it expires: the agent sends nothing before the whole
      // conversation, so the pill and an empty transcript are the entire
      // signal. The sibling `new` path sets an expectation the same way.
      var cap = payload.timeoutSeconds
        ? ' The server gives up after ' + payload.timeoutSeconds + 's.' : '';
      addMessage('note', 'loading this session from the agent — the whole '
        + 'conversation arrives at once when it answers, usually within a few '
        + 'seconds.' + cap);
      logLine('info', 'loading the session from the agent — the whole ' +
                      'conversation arrives at once when it answers.' + cap);
      return;
    }
    if (type === 'meta' && payload.turn === 'start') {
      agentBody = null;
      pendingPrompt = null;
      // Live turn markers move the buttons; replayed ones only separate the
      // transcript's bubbles. Whether a turn is running *now* is what the
      // `session` frame says, because these markers are evictable.
      if (!replaying) setTurn(true);
      return;
    }
    if (type === 'meta' && payload.turn === 'end') {
      agentBody = null;
      if (!replaying) setTurn(false);
      if (payload.stopReason && payload.stopReason !== 'end_turn') {
        // Written into the transcript, not only the log strip, because the
        // log is not replayed: a turn that failed would otherwise come back
        // after a reload as a prompt with no answer and no explanation —
        // exactly the hung-turn appearance turn boundaries exist to prevent.
        addMessage('note', 'turn ended: ' + payload.stopReason);
      }
      logLine('info', '← turn end (' + payload.stopReason + ')');
      return;
    }
    if (type === 'meta' && payload.contextPercent !== undefined) {
      // Never replayed: the server keeps the latest reading on the session and
      // puts it on the `session` frame instead, because the ring buffer is
      // built to evict and a stale percentage is worse than none.
      setContext(payload.contextPercent);
      logLine('info', '← context window ' + payload.contextPercent + '%');
      return;
    }
    if (type === 'chunk') {
      appendChunk(payload.role === 'user' ? 'user' : 'agent', payload.text || '');
      return;
    }
    if (type === 'tool_call' || type === 'tool_update') {
      addToolCall(payload);
      logLine('in', '← ' + type + ' ' + (payload.title || payload.kind || '') +
                    ' [' + (payload.status || '') + ']');
      return;
    }
    if (type === 'history_truncated') {
      addMessage('note', payload.message || 'earlier events were dropped');
      return;
    }
    if (type === 'history') {
      // One frame carrying every buffered event, replayed through this same
      // handler so live and replayed frames cannot drift apart in how they
      // render. The transcript was cleared by the `session` frame that
      // preceded it, which is what stops a reconnect duplicating it.
      var events = payload.events || [];
      replaying = true;
      try {
        for (var i = 0; i < events.length; i++) handle(events[i]);
      } finally {
        replaying = false;
      }
      logLine('info', '← history: ' + events.length + ' event(s) replayed');
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
      return;
    }
    if (type === 'session') {
      setPending(false);
      setLoading(null);
      loadFailed = false;
      sessionId = payload.sessionId;
      // This socket is now in the session's subscribers, so every frame the
      // session broadcasts — `session_closed` included — will reach it.
      subscribed = true;
      clearTranscript();
      // The server's answer, not an inference from whatever survived in the
      // buffer. A turn longer than the buffer replays without its start
      // marker, and Send would otherwise come back enabled against a session
      // still holding the turn.
      setTurn(!!payload.turnActive);
      // `null` for a session that has not run a turn yet, which hides the
      // meter rather than drawing an empty one.
      setContext(payload.contextPercent);
      sidEl.textContent = 'session ' + payload.sessionId;
      logLine('in', '← session ' + payload.sessionId +
                    (payload.created ? ' (created' : ' (resubscribed') +
                    ', cwd ' + payload.cwd + ')');
      // Carry the id in the URL so a reload re-subscribes to this session
      // instead of stranding it. replaceState rather than pushState: a session
      // is not a navigation step and Back should still leave the page.
      history.replaceState(null, '',
        location.pathname + '?sid=' + encodeURIComponent(payload.sessionId));
      return;
    }
    if (type === 'session_closed') {
      // These clears are repeated by the terminal `close_in_progress` arm
      // below rather than shared through a helper: tests/test_web.py pins them
      // as literal text *inside this branch*, so hoisting them silently breaks
      // that test. Change one arm, change the other.
      sessionId = null;
      setTurn(false);
      setContext(null);
      setPending(false);
      sidEl.textContent = '';
      // The transcript stays: the user pressed Close on a conversation they
      // were just reading, and it is still worth reading afterwards.
      addMessage('note', payload.message + ' The conversation itself is still '
        + "in the agent's own store, so it can be reopened from the "
        + 'PowerAtlas dashboard.');
      // The id leaves the URL with the session. Left in place, a reload would
      // re-adopt the session through `load` and spend the ~254 MB again —
      // silently undoing the one thing the user pressed the button for.
      history.replaceState(null, '', location.pathname);
      logLine('info', '← session_closed ' + payload.sessionId);
      return;
    }
    if (type === 'agent_died') {
      setPending(false);
      setLoading(null);
      sessionId = null;
      setTurn(false);
      setContext(null);
      setState('closed', 'agent gone');
      sidEl.textContent = '';
      addMessage('error', 'the agent exited (code ' + payload.exitCode + ') — ' +
                          payload.message);
      restorePendingPrompt('the agent exited');
      logLine('error', '← agent_died (exit ' + payload.exitCode + ') ' +
                       payload.message);
      return;
    }
    if (type === 'error') {
      setPending(false);
      // A refused `cancel` or `close` leaves its button reading "Stopping…" /
      // "Closing…" and disabled, with no other frame coming to restore it.
      // Re-asserting the turn state the page already holds costs nothing and
      // repaints both buttons from it.
      setTurn(turnActive);
      if (payload.code === 'close_in_progress' && sessionId &&
          frame.sessionId === sessionId) {
        // The session named here is being released, so the page must stop
        // holding it either way. The id guard is the point of the condition: a
        // refusal naming some other session must not wipe this one.
        //
        // `subscribed` is what separates the two ways this frame arrives. A
        // refused `subscribe` or `load` was never added to the registry's
        // subscribers, so the broadcast that follows the close never reaches
        // it and **no `session_closed` is coming** — this arm is the only one
        // that will ever run, and a page that reconnected into the close
        // window would otherwise sit on a transcript whose session no longer
        // exists, with ?sid= still in the URL ready to re-adopt it on the next
        // reload. A refused `prompt`, or a second `close`, is the opposite
        // case: that socket *is* subscribed and a `session_closed` will follow.
        setLoading(null);
        // Same clears as `session_closed`, deliberately duplicated — see the
        // note there.
        sessionId = null;
        setTurn(false);
        setContext(null);
        setPending(false);
        sidEl.textContent = '';
        history.replaceState(null, '', location.pathname);
        if (subscribed) {
          // `session_closed` keeps the transcript on purpose — the user was
          // reading that conversation a moment ago and it is still worth
          // reading — so clearing it here would take it away a beat before the
          // frame that deliberately preserves it.
          addMessage('note', payload.message + ' The conversation itself is '
            + "still in the agent's own store, so it can be reopened from the "
            + 'PowerAtlas dashboard.');
        } else {
          // Nothing arrived to put this transcript here on this connection —
          // it is whatever survived the drop, and there is now nothing behind
          // it and nothing coming to say so.
          clearTranscript();
          addMessage('note', payload.message + ' Everything on screen belonged '
            + 'to that session, so the transcript went with it; the conversation '
            + "is still in the agent's own store and can be reopened from the "
            + 'PowerAtlas dashboard.');
        }
        if (!replaying) restorePendingPrompt(payload.code);
        logLine('error', '← error [close_in_progress] ' + payload.message);
        return;
      }
      if (payload.code === 'unknown_session' && sessionId &&
          frame.sessionId === sessionId && !loadTried['s:' + sessionId]) {
        // This server does not hold the session, so there is nothing to replay
        // from memory — but the agent keeps its own store, and that is where a
        // session created in a terminal, or before a restart, still lives.
        // Not rendered as an error: it is the expected first answer for every
        // session this process did not create, which is the whole case the
        // dashboard's row action opens.
        loadTried['s:' + sessionId] = true;
        logLine('info', 'not live on this server — asking the agent to load it');
        if (send('load', {}, sessionId)) return;
      }
      var failedLoad = loadingSid !== null &&
                       (frame.sessionId || sessionId) === loadingSid;
      setLoading(null);
      // In the transcript as well as the log: the log strip is 120 px tall and
      // is not replayed, so a failure that reaches only it is invisible after
      // a reload and easy to miss before one.
      addMessage('error', '[' + payload.code + '] ' + payload.message);
      if (!replaying) restorePendingPrompt(payload.code);
      logLine('error', '← error [' + payload.code + '] ' + payload.message);
      if (failedLoad) reportLoadFailure();
      return;
    }
    logLine('in', '← ' + type + ' ' + JSON.stringify(payload));
  }

  function reportStaleToken() {
    // The server answered an ordinary GET but refused the socket. The /acp
    // token is regenerated on every launch and baked into the page at render
    // time, so the one this tab holds belongs to a process that has exited.
    // Reconnect would replay that dead token forever; only a reload can pick up
    // the live one, and it keeps ?sid= so the session is re-subscribed rather
    // than abandoned. Rotation is a security property and stays — the page
    // recovers from it instead of the server weakening it.
    setState('closed', 'stale token');
    logLine('error', 'handshake rejected while the server is up: this tab was served ' +
                     'by an earlier PowerAtlas process, and the /acp token is ' +
                     'regenerated every launch. Reload to pick up the current one.');
    reconnectBtn.hidden = true;
    reloadBtn.hidden = false;
  }

  function diagnoseRejectedHandshake() {
    // No onopen, so the handshake itself was refused. web.py closes before
    // accept(), which uvicorn turns into an HTTP 403 with the code discarded,
    // and the browser reports that as 1006 with an empty reason — byte for byte
    // what it reports when there is no server at all. The page cannot tell those
    // apart from the close event, so ask the server directly: if a plain GET of
    // this same page succeeds, the server is up and it is the token that is
    // stale.
    setState('closed', 'handshake rejected');
    reconnectBtn.hidden = true;
    fetch(location.pathname + location.search, {
      cache: 'no-store',
      credentials: 'same-origin'
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      reportStaleToken();
    }).catch(function () {
      setState('closed', 'server unreachable');
      logLine('info', 'the server is not answering — it may still be starting. ' +
                      'Reconnect once it is back up.');
      reconnectBtn.hidden = false;
    });
  }

  function connect() {
    setState('connecting', 'connecting…');
    reconnectBtn.hidden = true;
    reloadBtn.hidden = true;
    opened = false;
    // A new socket subscribes to nothing until the server answers it.
    subscribed = false;
    loadTried = Object.create(null);
    loadingSid = null;
    loadFailed = false;
    ws = new WebSocket(wsUrl());
    ws.onopen = function () {
      opened = true;
      setState('open', 'connected');
      logLine('info', 'socket open to ' + location.host);
      if (sessionId) send('subscribe', {}, sessionId);
    };
    ws.onmessage = function (ev) {
      var frame;
      try {
        frame = JSON.parse(ev.data);
      } catch (e) {
        logLine('error', '← unparseable frame');
        return;
      }
      handle(frame);
    };
    ws.onclose = function (ev) {
      // A socket that drops while session/new or a turn is in flight would
      // otherwise leave those buttons disabled with nothing left to re-enable
      // them: the frame that would have done it died with the socket.
      setPending(false);
      setTurn(false);
      setLoading(null);
      setState('closed', 'disconnected (' + ev.code + ')');
      logLine('info', 'socket closed, code ' + ev.code + (ev.reason ? ' — ' + ev.reason : ''));
      if (opened) {
        reconnectBtn.hidden = false;
      } else {
        diagnoseRejectedHandshake();
      }
    };
    ws.onerror = function () {
      logLine('error', 'socket error — the handshake may have been rejected');
    };
  }

  newBtn.addEventListener('click', function () {
    send('new', { cwd: cwdInput.value.trim() }, null);
  });
  stopBtn.addEventListener('click', function () {
    if (!sessionId || !turnActive) return;
    if (!send('cancel', {}, sessionId)) return;
    // The turn does not end here. The agent finishes the request it is
    // holding and answers `stopReason: "cancelled"`, which arrives as an
    // ordinary turn boundary — so the button reports that it has asked, and
    // `setTurn(false)` on that boundary is what puts Send back.
    stopBtn.disabled = true;
    stopBtn.textContent = 'Stopping…';
  });
  closeBtn.addEventListener('click', function () {
    if (!sessionId) return;
    if (!send('close', {}, sessionId)) return;
    closeBtn.disabled = true;
    closeBtn.textContent = 'Closing…';
  });
  railSearch.addEventListener('input', function () {
    // Client-side, over the rows already loaded. The listing endpoint has no
    // search parameter, and the alternative — a request per keystroke against a
    // route whose per-row cost is a file read plus a psutil query — is an
    // amplification lever, not a feature.
    railFilter = String(railSearch.value || '').trim().toLowerCase();
    // Typing is not a rail activation. The box is outside the rebuilt container
    // and keeps focus by itself, so any pending restore is dropped rather than
    // allowed to pull focus off the box mid-word.
    railFocus = null;
    renderRail();
  });
  railMore.addEventListener('click', function () {
    railFocus = { more: true };
    loadGroupPage(railGroupPage + 1);
  });
  railReload.addEventListener('click', function () { loadGroupPage(1); });
  reconnectBtn.addEventListener('click', connect);
  reloadBtn.addEventListener('click', function () { location.reload(); });
  sendBtn.addEventListener('click', sendPrompt);
  promptInput.addEventListener('keydown', function (ev) {
    // Enter sends and Shift+Enter breaks the line, which is why this is a
    // textarea and not an input: a prompt with a code block in it is normal.
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.ctrlKey && !ev.altKey) {
      ev.preventDefault();
      sendPrompt();
    }
  });

  if (ACP_ERROR) {
    setState('closed', 'unavailable');
    logLine('error', 'the server could not import its ACP module: ' + ACP_ERROR);
    logLine('info', 'only this page is affected — the rest of PowerAtlas is running ' +
                    'normally. Fix the import and restart the server.');
    newBtn.disabled = true;
    promptInput.disabled = true;
    // The rail's only action is to open a session, and there is no ACP module
    // to open one with, so listing them would be an invitation to a dead end.
    // Saying so is not enough on its own: Refresh's listener is registered
    // unconditionally, so a press replaces this line with "10 of 12 workspaces"
    // and a full rail of rows that cannot open anything. Both controls are
    // turned off, which is the version of "not available" a keyboard and a
    // screen reader also get.
    railReload.disabled = true;
    railSearch.disabled = true;
    railStatus.textContent = 'the session list is unavailable while the ACP '
      + 'module is not loaded';
  } else {
    connect();
    loadGroupPage(1);
  }
})();
</script>
{% endblock %}
