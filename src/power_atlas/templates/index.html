{% extends "base.html" %}
{% block content %}
<div class="topbar">
  <img src="/static/poweratlas-banner.png" class="topbar-banner" alt="PowerAtlas">
  <div class="topbar-spacer"></div>
  <button class="topbar-profile-btn" onclick="openProfileModal()" title="Click to manage launch profiles" aria-label="Click to manage launch profiles">
    ⚙️ {{ active_launch_profile.name }}
  </button>
  <div class="topbar-toggle{% if autostart %} active{% endif %}" onclick="this.classList.toggle('active');fetch('/api/autostart',{method:'POST'})">
    <span class="trust-dot"></span>Autostart
  </div>
  <div class="refresh-group">
    <span class="refresh-time" id="refreshTime"></span>
    <button class="refresh-btn" onclick="doRefresh()" aria-label="Refresh sessions">↻</button>
  </div>
  <div class="peek-hotkey-group">
    <label class="peek-label" for="peekHotkey">Peek</label>
    <input type="text" id="peekHotkey" class="peek-input" value="{{ peek_hotkey }}" placeholder="ctrl+shift+z"
           onchange="var v=this.value.trim().toLowerCase();fetch('/api/save-setting',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'peek_hotkey',value:v})})">
  </div>
  <div class="port-group">
    <label class="port-label" for="portMode">Port</label>
    <select class="port-mode" id="portMode" onchange="togglePortInput(this.value)">
      <option value="random" {% if not port %}selected{% endif %}>Random</option>
      <option value="static" {% if port %}selected{% endif %}>Static</option>
    </select>
    <input type="number" id="portValue" class="port-input" min="1024" max="65535"
           aria-label="Port number"
           value="{{ port if port else '' }}"
           style="display:{% if port %}inline-block{% else %}none{% endif %}"
           placeholder="e.g. 49152"
           onkeydown="if(event.key==='Enter')savePort()">
    <button class="port-randomize" id="portRandomize" onclick="randomizePort()"
            aria-label="Randomize port"
            style="display:{% if port %}inline-block{% else %}none{% endif %}"
            title="Pick a random port">&#x1f504;</button>
    <button class="port-save-btn" id="portSave" onclick="savePort()"
            style="display:{% if port %}inline-block{% else %}none{% endif %}">Apply</button>
  </div>
</div>

<div class="search-area">
  <div class="command-bar">
    <span class="search-icon">⌕</span>
    <input type="search" name="q" placeholder="Search sessions, folders..." aria-label="Search workspaces"
           hx-get="/search" hx-trigger="input changed delay:300ms" hx-target="#workspace-cards">
  </div>
  <div class="provider-filter" id="providerFilter" role="tablist"></div>
</div>

<main class="panels-container">
  <aside class="left-panel" id="left-panel">
    <div class="section-label"><span>Launchers</span> <button class="launcher-add-btn" onclick="openNewLauncher()">+</button></div>
    <div id="launcher-tiles" class="launcher-grid" hx-get="/partials/launchers" hx-trigger="load" hx-swap="innerHTML"></div>
    <div id="pinned-cards" hx-get="/partials/pinned-sessions?fresh=1" hx-trigger="load" hx-swap="innerHTML"
         hx-on::after-swap="loadExpandedCards()">
    </div>
  </aside>
  <div class="center-panel" id="center-panel">
    <div id="pinned-workspaces" hx-get="/partials/pinned-workspaces?fresh=1" hx-trigger="load" hx-swap="innerHTML"
         hx-on::after-swap="loadExpandedCards()">
    </div>
  </div>
  <section class="right-panel" id="cards-area">
    <div class="section-label">Workspaces</div>
    <div id="workspace-cards" aria-busy="true"
         hx-get="/partials/workspaces?fresh=1" hx-trigger="load" hx-swap="innerHTML"
         hx-on::after-swap="this.removeAttribute('aria-busy');loadExpandedCards();startPinnedPoll()">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </section>
</main>

<div class="action-bar" id="actionBar">
  <span class="selection-info"><strong id="selCount">0</strong> sessions selected</span>
  <div class="topbar-spacer"></div>
  <button class="action-btn secondary" onclick="document.querySelectorAll('.session-row.selected,.workspace-card.selected').forEach(r=>r.classList.remove('selected'));updateActionBar()">Clear</button>
  <button class="action-btn launch" onclick="launchSelected()">▶ Launch selected</button>
</div>
<script>
function togglePortInput(mode) {
  var show = mode === 'static';
  document.getElementById('portValue').style.display = show ? 'inline-block' : 'none';
  document.getElementById('portRandomize').style.display = show ? 'inline-block' : 'none';
  document.getElementById('portSave').style.display = 'inline-block';
  document.getElementById('portSave').onclick = function() {
    if (mode === 'random') { savePortAndRestart(0); }
    else { savePort(); }
  };
}
function randomizePort() {
  var port = 49152 + Math.floor(Math.random() * (65535 - 49152 + 1));
  document.getElementById('portValue').value = port;
  document.getElementById('portSave').style.display = 'inline-block';
}
function savePort() {
  var v = parseInt(document.getElementById('portValue').value, 10);
  if (!v || v < 1024 || v > 65535) { showToast('<div class="toast toast-error">Port must be 1024\u201365535<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>'); return; }
  savePortAndRestart(v);
}
function savePortAndRestart(portValue) {
  fetch('/api/save-setting', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({key: 'port', value: portValue})})
    .then(function() {
      showRestartOverlay(portValue);
      return fetch('/api/restart', {method: 'POST'});
    }).catch(function() {});
}
function showRestartOverlay(newPort) {
  var overlay = document.createElement('div');
  overlay.className = 'restart-overlay';
  overlay.innerHTML = '<div class="restart-msg">Restarting\u2026</div>';
  document.body.appendChild(overlay);
  var target = newPort > 0 ? 'http://127.0.0.1:' + newPort : window.location.origin;
  var attempts = 0;
  var poll = setInterval(function() {
    attempts++;
    if (attempts > 30) { clearInterval(poll); overlay.innerHTML = '<div class="restart-msg">Restart timed out. <a href="javascript:void(0)" onclick="this.closest(\'.restart-overlay\').remove()">Dismiss</a></div>'; return; }
    fetch(target + '/api/last-refresh', {mode: 'no-cors'}).then(function() {
      clearInterval(poll);
      window.location.href = target;
    }).catch(function() {});
  }, 500);
}
window._activeProvider='all';
var _lastClicked=new WeakMap();
function handleItemClick(item,event,selector){var container=item.parentElement;if(!container)return;if(event.shiftKey){var last=_lastClicked.get(container);if(last&&last!==item&&container.contains(last)){var items=Array.from(container.querySelectorAll(selector));var idxA=items.indexOf(last);var idxB=items.indexOf(item);if(idxA!==-1&&idxB!==-1){var start=Math.min(idxA,idxB);var end=Math.max(idxA,idxB);for(var i=start;i<=end;i++){items[i].classList.add('selected')}}updateActionBar();return}}_lastClicked.set(container,item);item.classList.toggle('selected');updateActionBar()}
function updateActionBar(){var sessionCount=document.querySelectorAll('.session-row.selected').length;var workspaceCount=document.querySelectorAll('.workspace-card.selected').length;document.getElementById('selCount').textContent=sessionCount+workspaceCount;document.getElementById('actionBar').classList.toggle('visible',sessionCount>0||workspaceCount>0);var launchBtn=document.querySelector('.action-btn.launch');if(launchBtn){launchBtn.disabled=sessionCount===0;launchBtn.title=sessionCount===0?'Select sessions to launch (use launcher tiles for workspaces)':''}updateLauncherBadges()}
function toggleCard(card){card.classList.toggle('collapsed');var header=card.querySelector('.card-header');if(header)header.setAttribute('aria-expanded',!card.classList.contains('collapsed'));var body=card.querySelector('.card-body');if(!card.classList.contains('collapsed')&&body.dataset.loaded==='false'){body.dataset.loaded='true';var cwd=card.dataset.cwd;var provider=window._activeProvider||'all';fetch('/partials/sessions?cwd='+encodeURIComponent(cwd)+'&provider='+encodeURIComponent(provider)).then(function(r){return r.text()}).then(function(html){body.innerHTML=html}).catch(function(){body.innerHTML='<div class="new-session-inline">Failed to load</div>'})}}
function refreshCards(fresh){var qs=fresh?'&fresh=1':'';var expandedCards=[];document.querySelectorAll('.workspace-card:not(.collapsed)').forEach(function(c){expandedCards.push(c.dataset.cwd)});var provQs='provider='+encodeURIComponent(window._activeProvider||'all');fetch('/partials/workspaces?'+provQs+qs).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('workspace-cards');el.innerHTML=html;if(window.htmx)htmx.process(el);expandedCards.forEach(function(key){el.querySelectorAll('.workspace-card').forEach(function(card){if(card.dataset.cwd===key){card.classList.remove('collapsed');var body=card.querySelector('.card-body');if(body){body.dataset.loaded='true';var prov=window._activeProvider||'all';fetch('/partials/sessions?cwd='+encodeURIComponent(card.dataset.cwd)+'&provider='+encodeURIComponent(prov)+'&fresh=1').then(function(r){return r.text()}).then(function(h){body.innerHTML=h})}}})});loadExpandedCards();updateActionBar()});fetch('/partials/pinned-sessions?'+provQs+(fresh?'&fresh=1':'')).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('pinned-cards');el.innerHTML=html;if(window.htmx)htmx.process(el);loadExpandedCards()});fetch('/partials/pinned-workspaces?'+provQs+(fresh?'&fresh=1':'')).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('pinned-workspaces');el.innerHTML=html;if(window.htmx)htmx.process(el);loadExpandedCards()})}
function resetOverlays(){var modal=document.getElementById('launcherModal');if(modal&&modal.open)modal.close();var picker=document.getElementById('emoji-picker');if(picker)picker.style.display='none';document.querySelectorAll('.session-tooltip-slot').forEach(function(s){s.style.display='none'});var toasts=document.getElementById('toastContainer');if(toasts){toasts.querySelectorAll('.toast').forEach(function(t){if(!t.dataset.ts||(Date.now()-parseInt(t.dataset.ts,10))>1000)t.remove()})}}
function showToast(html){var c=document.getElementById('toastContainer');if(!c){c=document.createElement('div');c.id='toastContainer';c.className='toast-container';document.body.appendChild(c)}var d=document.createElement('div');d.innerHTML=html;var t=d.firstElementChild;if(!t){t=document.createElement('div');t.className='toast toast-success';t.textContent=html||'Done'}t.dataset.ts=Date.now();c.appendChild(t);if(!t.classList.contains('toast-persistent')){setTimeout(function(){t.remove()},4000)}}
function resumeSession(btn){var row=btn.closest('.session-row');var card=row.closest('.workspace-card');var provider=row.dataset.provider||(card?card.dataset.provider||'':'');fetch('/api/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:row.dataset.sid,workspace:row.dataset.cwd,provider:provider})}).then(function(r){return r.text()}).then(showToast)}
function copySid(btn){var row=btn.closest('.session-row');navigator.clipboard.writeText(row.dataset.sid).then(function(){showToast('<div class="toast toast-success">Copied<button class="toast-dismiss" onclick="this.parentElement.remove()">×</button></div>')})}
function pinSession(btn){var row=btn.closest('.session-row');var pinned=btn.classList.contains('pinned');var url=pinned?'/api/unpin-session':'/api/pin-session';fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:row.dataset.sid,workspace:row.dataset.cwd})}).then(function(){btn.classList.toggle('pinned');showToast('<div class="toast toast-success">'+(pinned?'Unpinned':'Pinned')+'<button class="toast-dismiss" onclick="this.parentElement.remove()">×</button></div>');fetch('/partials/pinned-sessions').then(function(r){return r.text()}).then(function(html){var el=document.getElementById('pinned-cards');el.innerHTML=html;if(window.htmx)htmx.process(el)})})}
function pinWorkspace(btn){var card=btn.closest('.workspace-card');var pinned=btn.classList.contains('pinned');var url=pinned?'/api/unpin-folder':'/api/pin-folder';fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({folder:card.dataset.cwd})}).then(function(){refreshCards(true);showToast('<div class="toast toast-success">'+(pinned?'Unpinned':'Pinned')+'<button class="toast-dismiss" onclick="this.parentElement.remove()">×</button></div>')})}
function launchNew(btn,provider){var card=btn.closest('.workspace-card');fetch('/api/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace:card.dataset.cwd,provider:provider})}).then(function(r){return r.text()}).then(showToast)}
function launchSelected(){var sessions=[];document.querySelectorAll('.session-row.selected').forEach(function(r){sessions.push({session_id:r.dataset.sid,workspace:r.dataset.cwd,provider:r.dataset.provider})});if(!sessions.length)return;if(sessions.length>5&&!confirm('Launch '+sessions.length+' sessions?'))return;fetch('/api/launch-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessions:sessions})}).then(function(r){return r.text()}).then(showToast)}
function loadExpandedCards(){document.querySelectorAll('.workspace-card:not(.collapsed)').forEach(function(card){var body=card.querySelector('.card-body');if(body&&body.dataset.loaded==='false'){body.dataset.loaded='true';var provider=window._activeProvider||'all';fetch('/partials/sessions?cwd='+encodeURIComponent(card.dataset.cwd)+'&provider='+encodeURIComponent(provider)).then(function(r){return r.text()}).then(function(html){body.innerHTML=html})}})}
function refreshExpandedSessions(){document.querySelectorAll('.workspace-card:not(.collapsed)').forEach(function(card){var body=card.querySelector('.card-body');if(body&&body.dataset.loaded==='true'){var provider=window._activeProvider||'all';fetch('/partials/sessions?cwd='+encodeURIComponent(card.dataset.cwd)+'&provider='+encodeURIComponent(provider)+'&fresh=1').then(function(r){return r.text()}).then(function(html){body.innerHTML=html})}})}
function refreshSettings(){var modal=document.getElementById('launcherModal');if(modal&&modal.open)return;var profileModal=document.getElementById('profileModal');if(profileModal&&profileModal.open)return;fetch('/api/settings').then(function(r){return r.json()}).then(function(d){var profileBtn=document.querySelector('.topbar-profile-btn');if(profileBtn&&d.launch_profiles&&d.active_launch_profile){var active=d.launch_profiles.find(function(p){return p.id===d.active_launch_profile});if(active){profileBtn.textContent='\u2699\ufe0f '+active.name}}var peekInput=document.getElementById('peekHotkey');if(peekInput)peekInput.value=d.peek_hotkey||'ctrl+shift+z';var toggle=document.querySelector('.topbar-toggle');if(toggle){if(d.autostart){toggle.classList.add('active')}else{toggle.classList.remove('active')}}_providerSettings=d.provider_settings||{};_launchers=d.custom_launchers||[];var tilesEl=document.getElementById('launcher-tiles');if(tilesEl){fetch('/partials/launchers').then(function(r){return r.text()}).then(function(html){tilesEl.innerHTML=html;if(window.htmx)htmx.process(tilesEl)})}}).catch(function(){})}
document.addEventListener('DOMContentLoaded',function(){document.addEventListener('htmx:afterSwap',function(){loadExpandedCards()});fetch('/api/last-refresh').then(function(r){return r.json()}).then(function(d){if(d.last_refresh)document.getElementById('refreshTime').textContent=d.last_refresh});initProviderFilter();
document.addEventListener('visibilitychange',function(){if(!document.hidden){refreshSettings();refreshCards(true)}});
});
function initProviderFilter(){fetch('/api/available-providers').then(function(r){return r.json()}).then(function(providers){var container=document.getElementById('providerFilter');if(!providers||providers.length<2){container.style.display='none';return}var html='<button class="provider-filter-btn active" data-provider="all" role="tab" aria-selected="true" onclick="switchProvider(\'all\')">All</button>';providers.forEach(function(p){html+='<button class="provider-filter-btn" data-provider="'+p.name+'" role="tab" aria-selected="false" onclick="switchProvider(\''+p.name+'\')">'+p.display+'</button>'});container.innerHTML=html;container.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){var btns=Array.from(this.querySelectorAll('.provider-filter-btn'));var idx=btns.indexOf(document.activeElement);if(idx<0)return;var next=e.key==='ArrowRight'?(idx+1)%btns.length:(idx-1+btns.length)%btns.length;btns[next].focus();e.preventDefault()}})})}
function switchProvider(provider){window._activeProvider=provider;document.querySelectorAll('.provider-filter-btn').forEach(function(b){b.classList.toggle('active',b.dataset.provider===provider);b.setAttribute('aria-selected',b.dataset.provider===provider?'true':'false')});var qs='?provider='+encodeURIComponent(provider);fetch('/partials/workspaces'+qs).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('workspace-cards');el.innerHTML=html;if(window.htmx)htmx.process(el);loadExpandedCards();updateActionBar()});fetch('/partials/pinned-sessions'+qs).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('pinned-cards');el.innerHTML=html;if(window.htmx)htmx.process(el)});fetch('/partials/pinned-workspaces'+qs).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('pinned-workspaces');el.innerHTML=html;if(window.htmx)htmx.process(el)})}
var _pinnedPollTimer=null;var _pinnedPollCount=0;var _pinnedPollMax=8;
var _sessionRefreshTimer=null;
function startSessionRefresh(){if(_sessionRefreshTimer)return;_sessionRefreshTimer=setInterval(function(){refreshExpandedSessions();fetch('/api/last-refresh').then(function(r){return r.json()}).then(function(d){if(d.last_refresh)document.getElementById('refreshTime').textContent=d.last_refresh})},30000)}
function startPinnedPoll(){if(_pinnedPollTimer)return;_pinnedPollCount=0;startSessionRefresh();_pinnedPollTimer=setInterval(function(){_pinnedPollCount++;if(_pinnedPollCount>=_pinnedPollMax){clearInterval(_pinnedPollTimer);_pinnedPollTimer=null;return}var provQs='?provider='+encodeURIComponent(window._activeProvider||'all');fetch('/partials/pinned-sessions'+provQs).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('pinned-cards');el.innerHTML=html;if(window.htmx)htmx.process(el);loadExpandedCards()});fetch('/partials/pinned-workspaces'+provQs).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('pinned-workspaces');el.innerHTML=html;if(window.htmx)htmx.process(el);loadExpandedCards()})},15000)}
function doRefresh(){var btn=document.querySelector('.refresh-btn');btn.disabled=true;btn.textContent='...';fetch('/api/refresh',{method:'POST'}).then(function(r){return r.json()}).then(function(d){document.getElementById('refreshTime').textContent=d.last_refresh;refreshSettings();refreshCards(true)}).finally(function(){btn.disabled=false;btn.textContent='\u21BB'})}
var _tailTimers={};function loadTail(el){var row=el.closest('.session-row');var sid=row.dataset.sid;var provider=row.dataset.provider||'kiro-cli';var cwd=row.dataset.cwd||'';var slot=el.querySelector('.session-tooltip-slot');_tailTimers[sid]=setTimeout(function(){fetch('/partials/session-tail?sid='+encodeURIComponent(sid)+'&provider='+encodeURIComponent(provider)+'&cwd='+encodeURIComponent(cwd)).then(function(r){return r.text()}).then(function(html){slot.innerHTML=html;var rect=el.getBoundingClientRect();slot.style.left=rect.left+'px';slot.style.top=(rect.top-4)+'px';slot.style.transform='translateY(-100%)';slot.style.display='block'})},300)}function hideTail(el){var row=el.closest('.session-row');var sid=row.dataset.sid;clearTimeout(_tailTimers[sid]);var slot=el.querySelector('.session-tooltip-slot');slot.style.display='none'}
</script>
{% include "partials/emoji_picker.html" %}
{% include "partials/launcher_modal.html" %}
<script>
var _providerSettings={{provider_settings|tojson}};
var _providerBinaryDisplay={'kiro-cli':'kiro-cli chat','claude-code':'claude','kiro-ide':'kiro'};
var _providerTerminal={'kiro-cli':true,'claude-code':true,'kiro-ide':false};
function openProviderLauncherModal(id){var key=id.slice('provider--'.length);fetch('/api/provider/'+encodeURIComponent(key)).then(function(r){return r.json()}).then(function(d){var m=document.getElementById('launcherModal');document.getElementById('launcherId').value=id;document.getElementById('launcherName').value=d.provider||key;document.getElementById('launcherName').readOnly=true;document.getElementById('launcherCommand').value=_providerBinaryDisplay[key]||key;document.getElementById('launcherCommand').readOnly=true;document.getElementById('launcherArgs').value=d.default_args||'';document.getElementById('launcherCwd').value='';document.getElementById('launcherCwd').readOnly=true;document.getElementById('launcherEnv').value='';document.getElementById('launcherEnv').disabled=true;document.getElementById('launcherColor').value=d.color||'';document.getElementById('launcherTerminal').checked=_providerTerminal[key]!==false;document.getElementById('launcherTerminal').disabled=true;document.getElementById('launcherUseSelected').checked=true;document.getElementById('launcherUseSelected').disabled=true;document.getElementById('launcherDeleteBtn').style.display='none';document.getElementById('launcherEnabledRow').style.display='';document.getElementById('launcherEnabled').checked=d.enabled!==false;document.getElementById('launcherModalTitle').textContent='Provider Settings \u2014 '+key;document.querySelectorAll('.color-swatch').forEach(function(s){s.classList.toggle('selected',s.dataset.color===(d.color||''))});m.showModal()})}
document.getElementById('launcherModal').addEventListener('close',function(){var m=document.getElementById('launcherModal');m.querySelector('#launcherName').readOnly=false;m.querySelector('#launcherCommand').readOnly=false;m.querySelector('#launcherCwd').readOnly=false;m.querySelector('#launcherEnv').disabled=false;m.querySelector('#launcherTerminal').disabled=false;m.querySelector('#launcherUseSelected').disabled=false;document.getElementById('launcherEnabledRow').style.display='none'});
(function(){if(_providerSettings&&_providerSettings['kiro-cli']&&_providerSettings['kiro-cli'].default_args==='-a'&&!localStorage.getItem('pa_migration_toast')){localStorage.setItem('pa_migration_toast','1');setTimeout(function(){showToast('<div class="toast toast-success">Trust All is now per-provider \u2014 click \u2699\ufe0f on the provider tile to configure.<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')},1000)}})();
(function(){if(!localStorage.getItem('pa_profile_toast')){localStorage.setItem('pa_profile_toast','1');setTimeout(function(){showToast('<div class="toast toast-success">Terminal config is now Launch Profiles \u2014 click \u2699\ufe0f in the top bar to manage.<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')},1500)}})();
</script>
<script>
var _launchers={{launchers|tojson}};
function getSelectedWorkspaceCwds(){var seen={};var cwds=[];document.querySelectorAll('.workspace-card.selected').forEach(function(c){var key=c.dataset.cwd.toLowerCase();if(!seen[key]){seen[key]=1;cwds.push(c.dataset.cwd)}});document.querySelectorAll('.session-row.selected').forEach(function(r){var cwd=r.dataset.cwd;if(cwd){var key=cwd.toLowerCase();if(!seen[key]){seen[key]=1;cwds.push(cwd)}}});return cwds}
function updateLauncherBadges(){var count=getSelectedWorkspaceCwds().length;_launchers.forEach(function(l){if(!l.use_selected_workspaces)return;var badge=document.getElementById('badge-'+l.id);if(!badge)return;if(count>0){badge.textContent=count;badge.classList.add('visible')}else{badge.textContent='';badge.classList.remove('visible')}});document.querySelectorAll('.provider-tile .launcher-badge').forEach(function(badge){if(count>0){badge.textContent=count;badge.classList.add('visible')}else{badge.textContent='';badge.classList.remove('visible')}})}
function runLauncherById(id){if(id.startsWith('provider--')){var key=id.slice('provider--'.length);var selected=getSelectedWorkspaceCwds();if(selected.length>0){var sessions=selected.map(function(w){return{workspace:w,provider:key}});fetch('/api/launch-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessions:sessions})}).then(function(r){return r.text()}).then(showToast)}else if(!_providerTerminal[key]){fetch('/api/launch-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessions:[{workspace:'.',provider:key}]})}).then(function(r){return r.text()}).then(showToast)}else{showToast('<div class="toast toast-error">Select workspaces first<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')}return}var l=_launchers.find(function(x){return x.id===id});if(!l)return;if(l.use_selected_workspaces){var selected=getSelectedWorkspaceCwds();if(selected.length>0){fetch('/api/launcher/run-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:l.id,workspaces:selected})}).then(function(r){return r.text()}).then(showToast);return}}var cwd=l.cwd||'';fetch('/api/launcher/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:l.command,custom_args:l.custom_args||'',cwd:cwd,env:l.env,name:l.name,terminal:l.terminal})}).then(function(r){return r.text()}).then(showToast)}
function openNewLauncher(){var m=document.getElementById('launcherModal');document.getElementById('launcherId').value='';document.getElementById('launcherName').value='';document.getElementById('launcherCommand').value='';document.getElementById('launcherArgs').value='';document.getElementById('launcherCwd').value='';document.getElementById('launcherEnv').value='';document.getElementById('launcherColor').value='';document.getElementById('launcherTerminal').checked=true;document.getElementById('launcherUseSelected').checked=false;document.getElementById('launcherDeleteBtn').style.display='none';document.getElementById('launcherModalTitle').textContent='New Launcher';document.querySelectorAll('.color-swatch').forEach(function(s){s.classList.remove('selected')});m.showModal();m.querySelector('input[type=text]').focus()}
function editLauncher(id){if(id.startsWith('provider--')){openProviderLauncherModal(id);return}var l=_launchers.find(function(x){return x.id===id});if(!l)return;var m=document.getElementById('launcherModal');document.getElementById('launcherId').value=l.id;document.getElementById('launcherName').value=l.name||'';document.getElementById('launcherCommand').value=l.command||'';document.getElementById('launcherArgs').value=l.custom_args||'';document.getElementById('launcherCwd').value=l.cwd||'';document.getElementById('launcherEnv').value=Object.entries(l.env||{}).map(function(e){return e[0]+'='+e[1]}).join('\n');document.getElementById('launcherColor').value=l.color||'';document.getElementById('launcherTerminal').checked=l.terminal!==false;document.getElementById('launcherUseSelected').checked=l.use_selected_workspaces||false;document.getElementById('launcherDeleteBtn').style.display='';document.getElementById('launcherModalTitle').textContent='Edit Launcher';document.querySelectorAll('.color-swatch').forEach(function(s){s.classList.toggle('selected',s.dataset.color===l.color)});m.showModal();m.querySelector('input[type=text]').focus()}
function saveLauncher(e){e.preventDefault();var id=document.getElementById('launcherId').value;if(id.startsWith('provider--')){var key=id.slice('provider--'.length);var payload={provider:key,default_args:document.getElementById('launcherArgs').value,color:document.getElementById('launcherColor').value,enabled:document.getElementById('launcherEnabled').checked};fetch('/api/provider/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.text()}).then(function(t){showToast(t);document.getElementById('launcherModal').close();_providerSettings[key]=payload;fetch('/partials/launchers').then(function(r){return r.text()}).then(function(html){var el=document.getElementById('launcher-tiles');el.innerHTML=html;if(window.htmx)htmx.process(el)});refreshCards(true)}).catch(function(){showToast('<div class="toast toast-error">Save failed \u2014 try again<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')});return}var envText=document.getElementById('launcherEnv').value;var env={};envText.split('\n').forEach(function(line){var eq=line.indexOf('=');if(eq>0)env[line.slice(0,eq).trim()]=line.slice(eq+1).trim()});var payload={name:document.getElementById('launcherName').value,command:document.getElementById('launcherCommand').value,custom_args:document.getElementById('launcherArgs').value,cwd:document.getElementById('launcherCwd').value,env:env,color:document.getElementById('launcherColor').value,terminal:document.getElementById('launcherTerminal').checked,use_selected_workspaces:document.getElementById('launcherUseSelected').checked};var url=id?'/api/launcher/update':'/api/launcher/create';if(id)payload.id=id;fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.text()}).then(function(t){showToast(t);return fetch('/api/launchers')}).then(function(r){return r.json()}).then(function(d){_launchers=d;document.getElementById('launcherModal').close();fetch('/partials/launchers').then(function(r){return r.text()}).then(function(html){var el=document.getElementById('launcher-tiles');el.innerHTML=html;if(window.htmx)htmx.process(el)})}).catch(function(){showToast('<div class="toast toast-error">Save failed \u2014 try again<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')})}
function deleteLauncher(){var id=document.getElementById('launcherId').value;if(!id)return;fetch('/api/launcher/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})}).then(function(r){return r.text()}).then(function(t){showToast(t);return fetch('/api/launchers')}).then(function(r){return r.json()}).then(function(d){_launchers=d;document.getElementById('launcherModal').close();fetch('/partials/launchers').then(function(r){return r.text()}).then(function(html){var el=document.getElementById('launcher-tiles');el.innerHTML=html;if(window.htmx)htmx.process(el)})}).catch(function(){showToast('<div class="toast toast-error">Delete failed \u2014 try again<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')})}
document.getElementById('launcherColorPicker').addEventListener('click',function(e){var btn=e.target.closest('.color-swatch');if(!btn)return;var picker=document.getElementById('launcherColorPicker');var input=document.getElementById('launcherColor');var wasSelected=btn.classList.contains('selected');picker.querySelectorAll('.color-swatch').forEach(function(s){s.classList.remove('selected')});if(wasSelected){input.value=''}else{btn.classList.add('selected');input.value=btn.dataset.color}});
</script>
{% include "partials/launch_profile_modal.html" %}
<script>
var _launchProfiles={{launch_profiles|tojson}};
var _activeLaunchProfile={{active_launch_profile.id|tojson}};
function openProfileModal(){var m=document.getElementById('profileModal');renderProfileList();document.getElementById('profileForm').style.display='none';m.showModal()}
function renderProfileList(){var list=document.getElementById('profileList');var html='';_launchProfiles.forEach(function(p){var isActive=p.id===_activeLaunchProfile;var cls='profile-item'+(isActive?' active':'');html+='<div class="'+cls+'" data-id="'+p.id+'">';html+='<span class="profile-item-name"></span>';html+='<span class="profile-item-actions">';if(!isActive)html+='<button type="button" class="btn-sm" onclick="activateProfile(\''+p.id+'\')">Activate</button>';html+=' <button type="button" class="btn-sm" onclick="editProfile(\''+p.id+'\')">Edit</button>';html+='</span></div>'});list.innerHTML=html;list.querySelectorAll('.profile-item-name').forEach(function(el,i){el.textContent=_launchProfiles[i].name})}
function activateProfile(id){fetch('/api/launch-profile/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})}).then(function(r){return r.json()}).then(function(d){if(d.ok){_activeLaunchProfile=id;renderProfileList();var btn=document.querySelector('.topbar-profile-btn');var p=_launchProfiles.find(function(x){return x.id===id});if(btn&&p)btn.textContent='\u2699\ufe0f '+p.name}}).catch(function(){})}
function editProfile(id){var form=document.getElementById('profileForm');form.style.display='';var isNew=id==='__new__';var p=isNew?{id:'__new__',name:'',terminal_command:'wt new-tab --title {title} -p {wt_profile} -d {cwd} -- pwsh -NoExit -Command {pscmd}',wt_profile:'PowerShell'}:_launchProfiles.find(function(x){return x.id===id});if(!p)return;document.getElementById('profileId').value=p.id;document.getElementById('profileName').value=p.name;document.getElementById('profileTerminal').value=p.terminal_command;document.getElementById('profileWtProfile').value=p.wt_profile||'PowerShell';var delBtn=document.getElementById('profileDeleteBtn');delBtn.style.display=isNew||_launchProfiles.length<=1?'none':'';if(_launchProfiles.length<=1)delBtn.title='Cannot delete the last profile';else delBtn.title=''}
function saveProfile(){var payload={id:document.getElementById('profileId').value,name:document.getElementById('profileName').value,terminal_command:document.getElementById('profileTerminal').value,wt_profile:document.getElementById('profileWtProfile').value};fetch('/api/launch-profile/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.text()}).then(function(t){showToast(t);return fetch('/api/settings')}).then(function(r){return r.json()}).then(function(d){_launchProfiles=d.launch_profiles;_activeLaunchProfile=d.active_launch_profile;renderProfileList();var btn=document.querySelector('.topbar-profile-btn');var active=_launchProfiles.find(function(p){return p.id===_activeLaunchProfile});if(btn&&active)btn.textContent='\u2699\ufe0f '+active.name}).catch(function(){showToast('<div class="toast toast-error">Save failed<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')})}
function deleteProfile(){var id=document.getElementById('profileId').value;if(!id||id==='__new__')return;if(_launchProfiles.length<=1){showToast('<div class="toast toast-error">Cannot delete the last profile<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>');return}if(id===_activeLaunchProfile&&!confirm('This is the active profile. Delete and switch to another?'))return;fetch('/api/launch-profile/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})}).then(function(r){return r.text()}).then(function(t){showToast(t);return fetch('/api/settings')}).then(function(r){return r.json()}).then(function(d){_launchProfiles=d.launch_profiles;_activeLaunchProfile=d.active_launch_profile;renderProfileList();document.getElementById('profileForm').style.display='none';var btn=document.querySelector('.topbar-profile-btn');var active=_launchProfiles.find(function(p){return p.id===_activeLaunchProfile});if(btn&&active)btn.textContent='\u2699\ufe0f '+active.name}).catch(function(){showToast('<div class="toast toast-error">Delete failed<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')})}
</script>
{% endblock %}
