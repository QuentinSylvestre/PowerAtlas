{% extends "base.html" %}
{% block content %}
<div class="topbar">
  <img src="/static/poweratlas-banner.png" class="topbar-banner" alt="PowerAtlas">
  <div class="topbar-spacer"></div>
  <div class="topbar-cluster">
    <button class="topbar-profile-btn" onclick="openProfileModal()" title="Manage launch profiles (window mode, autostart, terminal)" aria-label="Manage launch profiles">
      ⚙️ {{ active_launch_profile.name }}
    </button>
    <div class="topbar-toggle{% if autostart %} active{% endif %}" onclick="this.classList.toggle('active');fetch('/api/autostart',{method:'POST'})" title="Auto-launch PowerAtlas on system startup">
      <span class="trust-dot"></span>Autostart
    </div>
    <div class="refresh-group" title="Last data refresh time">
      <span class="refresh-time" id="refreshTime"></span>
      <button class="refresh-btn" onclick="doRefresh()" aria-label="Refresh sessions" title="Refresh all sessions now">↻</button>
    </div>
  </div>
  <span class="topbar-separator" aria-hidden="true"></span>
  <div class="topbar-cluster">
    <div class="peek-hotkey-group" title="Global hotkey to show/hide the peek overlay window">
      <label class="peek-label" for="peekHotkey">Peek</label>
      <div class="hotkey-field" onclick="document.getElementById('peekHotkey').focus()">
        <span class="hotkey-icon">⌨</span>
        <input type="text" id="peekHotkey" class="peek-input" value="{{ peek_hotkey }}" placeholder="Press keys…"
               onfocus="this.parentElement.classList.add('focused')"
               onblur="this.parentElement.classList.remove('focused')"
               onchange="var v=this.value.trim().toLowerCase();fetch('/api/save-setting',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'peek_hotkey',value:v})})">
      </div>
    </div>
  </div>
  <span class="topbar-separator" aria-hidden="true"></span>
  <div class="topbar-cluster">
    <div class="port-group">
      <label class="port-label" for="portMode">Port</label>
      <select class="port-mode" id="portMode" onchange="togglePortInput(this.value);markPortDirty()">
        <option value="random" {% if not port %}selected{% endif %}>Random</option>
        <option value="static" {% if port %}selected{% endif %}>Static</option>
      </select>
      <input type="number" id="portValue" class="port-input" min="1024" max="65535"
             aria-label="Port number"
             value="{{ port if port else '' }}"
             style="display:{% if port %}inline-block{% else %}none{% endif %}"
             placeholder="e.g. 49152"
             oninput="markPortDirty()"
             onkeydown="if(event.key==='Enter')savePort()">
      <button class="port-randomize" id="portRandomize" onclick="randomizePort()"
              aria-label="Randomize port"
              style="display:{% if port %}inline-block{% else %}none{% endif %}"
              title="Pick a random port">&#x1f504;</button>
      <button class="port-save-btn" id="portSave" onclick="savePort()"
              title="Apply port change (restarts server)"
              style="display:{% if port %}inline-block{% else %}none{% endif %}">Apply</button>
    </div>
  </div>
</div>

<div class="search-area">
  <div class="command-bar">
    <span class="search-icon">⌕</span>
    <input type="search" name="q" placeholder="Search sessions, folders..." aria-label="Search workspaces">
  </div>
  <div class="provider-filter" id="providerFilter" role="tablist"></div>
</div>

<main class="panels-container">
  <aside class="left-panel" id="left-panel">
    <div class="section-label"><span>Launchers</span> <button class="launcher-add-btn" onclick="openNewLauncher()">+</button></div>
    <div id="launcher-tiles" class="launcher-grid" hx-get="/partials/launchers" hx-trigger="load" hx-swap="innerHTML"></div>
  </aside>
  <div class="center-panel" id="workspaces-panel">
    <div class="section-label"><span>Workspaces</span> <div class="workspace-filters" id="workspaceFilters"></div></div>
    <div id="workspace-cards" aria-busy="true"
         hx-get="/partials/workspaces?fresh=1" hx-trigger="load" hx-swap="innerHTML"
         hx-on::after-swap="this.removeAttribute('aria-busy');loadExpandedCards();startPolling()">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>
  <section class="right-panel" id="sessions-panel">
    <div class="section-label"><span>Sessions</span> <div class="session-filters" id="sessionFilters">
      <select class="ws-filter-select" id="statusFilter" onchange="setStatusFilter(this.value)" title="Filter by live status">
        <option value="">All status</option>
        <option value="live">🟢 Live</option>
        <option value="active">🟢 Active</option>
        <option value="needs_input">🟡 Needs input</option>
        <option value="idle">⚪ Idle</option>
        <option value="errored">🔴 Errored</option>
        <option value="closed">⚫ Closed</option>
      </select>
    </div></div>
    <div id="all-sessions" aria-busy="true"
         hx-get="/partials/all-sessions?page=1&fresh=1" hx-trigger="load" hx-swap="innerHTML"
         hx-on::after-swap="this.removeAttribute('aria-busy')">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </section>
</main>

<div class="action-bar" id="actionBar">
  <span class="selection-info"><strong id="selCount">0</strong> sessions selected</span>
  <div class="topbar-spacer"></div>
  <button class="action-btn secondary" onclick="document.querySelectorAll('.session-row.selected,.workspace-card.selected').forEach(r=>r.classList.remove('selected'));updateActionBar()">Clear</button>
  <button class="action-btn launch" onclick="launchSelected()">▶ Launch selected</button>
</div>
<script>
function markPortDirty() {
  var btn = document.getElementById('portSave');
  btn.classList.add('dirty');
  btn.style.display = 'inline-block';
}
function clearPortDirty() {
  document.getElementById('portSave').classList.remove('dirty');
}
function togglePortInput(mode) {
  var show = mode === 'static';
  document.getElementById('portValue').style.display = show ? 'inline-block' : 'none';
  document.getElementById('portRandomize').style.display = show ? 'inline-block' : 'none';
  document.getElementById('portSave').style.display = 'inline-block';
  document.getElementById('portSave').onclick = function() {
    if (mode === 'random') { savePortAndRestart(0); }
    else { savePort(); }
  };
}
function randomizePort() {
  var port = 49152 + Math.floor(Math.random() * (65535 - 49152 + 1));
  document.getElementById('portValue').value = port;
  markPortDirty();
}
function savePort() {
  var v = parseInt(document.getElementById('portValue').value, 10);
  if (!v || v < 1024 || v > 65535) { showToast('<div class="toast toast-error">Port must be 1024\u201365535<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>'); return; }
  clearPortDirty();
  savePortAndRestart(v);
}
function savePortAndRestart(portValue) {
  fetch('/api/save-setting', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({key: 'port', value: portValue})})
    .then(function() {
      showRestartOverlay(portValue);
      return fetch('/api/restart', {method: 'POST'});
    }).catch(function() {});
}
function showRestartOverlay(newPort) {
  var overlay = document.createElement('div');
  overlay.className = 'restart-overlay';
  overlay.innerHTML = '<div class="restart-msg">Restarting\u2026</div>';
  document.body.appendChild(overlay);
  var target = newPort > 0 ? 'http://127.0.0.1:' + newPort : window.location.origin;
  var attempts = 0;
  var poll = setInterval(function() {
    attempts++;
    if (attempts > 30) { clearInterval(poll); overlay.innerHTML = '<div class="restart-msg">Restart timed out. <a href="javascript:void(0)" onclick="this.closest(\'.restart-overlay\').remove()">Dismiss</a></div>'; return; }
    fetch(target + '/api/last-refresh', {mode: 'no-cors'}).then(function() {
      clearInterval(poll);
      window.location.href = target;
    }).catch(function() {});
  }, 500);
}
window._activeProvider='all';
window._activeTag='';
window._activeTimeFilter='';
window._activeStatus='';
function _buildWorkspaceQs(){var qs='provider='+encodeURIComponent(window._activeProvider||'all');if(window._activeTag)qs+='&tag='+encodeURIComponent(window._activeTag);if(window._activeTimeFilter)qs+='&time_filter='+encodeURIComponent(window._activeTimeFilter);if(window._activeStatus)qs+='&status='+encodeURIComponent(window._activeStatus);return qs}
function _statusQs(){return window._activeStatus?'&status='+encodeURIComponent(window._activeStatus):''}
var _lastClicked=new WeakMap();
function handleItemClick(item,event,selector){var container=item.parentElement;if(!container)return;if(event.shiftKey){var last=_lastClicked.get(container);if(last&&last!==item&&container.contains(last)){var items=Array.from(container.querySelectorAll(selector));var idxA=items.indexOf(last);var idxB=items.indexOf(item);if(idxA!==-1&&idxB!==-1){var start=Math.min(idxA,idxB);var end=Math.max(idxA,idxB);for(var i=start;i<=end;i++){items[i].classList.add('selected')}}updateActionBar();return}}_lastClicked.set(container,item);item.classList.toggle('selected');updateActionBar()}
function updateActionBar(){var sessionCount=document.querySelectorAll('.session-row.selected').length;var workspaceCount=document.querySelectorAll('.workspace-card.selected').length;document.getElementById('selCount').textContent=sessionCount+workspaceCount;document.getElementById('actionBar').classList.toggle('visible',sessionCount>0||workspaceCount>0);var launchBtn=document.querySelector('.action-btn.launch');if(launchBtn){launchBtn.disabled=sessionCount===0;launchBtn.title=sessionCount===0?'Select sessions to launch (use launcher tiles for workspaces)':''}updateLauncherBadges()}
function toggleCard(card){card.classList.toggle('collapsed');var header=card.querySelector('.card-header');if(header)header.setAttribute('aria-expanded',!card.classList.contains('collapsed'));var body=card.querySelector('.card-body');if(!card.classList.contains('collapsed')&&body.dataset.loaded==='false'){body.dataset.loaded='true';var cwd=card.dataset.cwd;var provider=window._activeProvider||'all';fetch('/partials/sessions?cwd='+encodeURIComponent(cwd)+'&provider='+encodeURIComponent(provider)+_statusQs()).then(function(r){return r.text()}).then(function(html){body.innerHTML=html;if(window.htmx)htmx.process(body)}).catch(function(){body.innerHTML='<div class="new-session-inline">Failed to load</div>'})}}
function refreshCards(fresh){var qs=fresh?'&fresh=1':'';var expandedCards=[];document.querySelectorAll('.workspace-card:not(.collapsed)').forEach(function(c){expandedCards.push(c.dataset.cwd)});var provQs=_buildWorkspaceQs();var wp=document.getElementById('workspace-cards');var sp=document.getElementById('all-sessions');if(wp)wp.setAttribute('aria-busy','true');if(sp)sp.setAttribute('aria-busy','true');fetch('/partials/workspaces?'+provQs+qs).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('workspace-cards');el.innerHTML=html;if(window.htmx)htmx.process(el);el.removeAttribute('aria-busy');expandedCards.forEach(function(key){el.querySelectorAll('.workspace-card').forEach(function(card){if(card.dataset.cwd===key){card.classList.remove('collapsed');var body=card.querySelector('.card-body');if(body){body.dataset.loaded='true';var prov=window._activeProvider||'all';fetch('/partials/sessions?cwd='+encodeURIComponent(card.dataset.cwd)+'&provider='+encodeURIComponent(prov)+_statusQs()+'&fresh=1').then(function(r){return r.text()}).then(function(h){body.innerHTML=h;if(window.htmx)htmx.process(body)})}}})});loadExpandedCards();updateActionBar()}).catch(function(){if(wp)wp.removeAttribute('aria-busy')});var sessQs=_buildWorkspaceQs();fetch('/partials/all-sessions?page=1&'+sessQs+qs).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('all-sessions');el.innerHTML=html;if(window.htmx)htmx.process(el);el.removeAttribute('aria-busy');updateActionBar()}).catch(function(){if(sp)sp.removeAttribute('aria-busy')})}
function resetOverlays(){var modal=document.getElementById('launcherModal');if(modal&&modal.open)modal.close();document.querySelectorAll('.session-tooltip-slot').forEach(function(s){s.style.display='none'});var toasts=document.getElementById('toastContainer');if(toasts){toasts.querySelectorAll('.toast').forEach(function(t){if(!t.dataset.ts||(Date.now()-parseInt(t.dataset.ts,10))>1000)t.remove()})}}
function showToast(html){var c=document.getElementById('toastContainer');if(!c){c=document.createElement('div');c.id='toastContainer';c.className='toast-container';document.body.appendChild(c)}var d=document.createElement('div');d.innerHTML=html;var t=d.firstElementChild;if(!t){t=document.createElement('div');t.className='toast toast-success';t.textContent=html||'Done'}t.dataset.ts=Date.now();c.appendChild(t);if(!t.classList.contains('toast-persistent')){setTimeout(function(){t.remove()},4000)}}
function resumeSession(btn){var row=btn.closest('.session-row');var card=row.closest('.workspace-card');var provider=row.dataset.provider||(card?card.dataset.provider||'':'');fetch('/api/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:row.dataset.sid,workspace:row.dataset.cwd,provider:provider})}).then(function(r){return r.text()}).then(showToast)}
function copySid(btn){var row=btn.closest('.session-row');navigator.clipboard.writeText(row.dataset.sid).then(function(){showToast('<div class="toast toast-success">Copied<button class="toast-dismiss" onclick="this.parentElement.remove()">×</button></div>')})}
function pinSession(btn){var row=btn.closest('.session-row');var pinned=btn.classList.contains('pinned');var url=pinned?'/api/unpin-session':'/api/pin-session';fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:row.dataset.sid,workspace:row.dataset.cwd})}).then(function(){btn.classList.toggle('pinned');showToast('<div class="toast toast-success">'+(pinned?'Unpinned':'Pinned')+'<button class="toast-dismiss" onclick="this.parentElement.remove()">×</button></div>');refreshCards(true)})}
function pinWorkspace(btn){var card=btn.closest('.workspace-card');var pinned=btn.classList.contains('pinned');var url=pinned?'/api/unpin-folder':'/api/pin-folder';fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({folder:card.dataset.cwd})}).then(function(){refreshCards(true);showToast('<div class="toast toast-success">'+(pinned?'Unpinned':'Pinned')+'<button class="toast-dismiss" onclick="this.parentElement.remove()">×</button></div>')})}
function launchNew(btn,provider){var card=btn.closest('.workspace-card');fetch('/api/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace:card.dataset.cwd,provider:provider})}).then(function(r){return r.text()}).then(showToast)}
function openFolder(cwd){fetch('/api/open-folder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({folder:cwd})}).then(function(r){return r.text()}).then(showToast).catch(function(){showToast('<div class="toast toast-error">Failed to open folder<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')})}
function openTerminal(btn){var card=btn.closest('.workspace-card');var cwd=card.dataset.cwd;fetch('/api/launch-terminal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace:cwd})}).then(function(r){return r.text()}).then(showToast).catch(function(){showToast('<div class="toast toast-error">Failed to open terminal<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')})}
function launchSelected(){var sessions=[];document.querySelectorAll('.session-row.selected').forEach(function(r){sessions.push({session_id:r.dataset.sid,workspace:r.dataset.cwd,provider:r.dataset.provider})});if(!sessions.length)return;if(sessions.length>5&&!confirm('Launch '+sessions.length+' sessions?'))return;fetch('/api/launch-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessions:sessions})}).then(function(r){return r.text()}).then(showToast)}
function loadExpandedCards(){document.querySelectorAll('.workspace-card:not(.collapsed)').forEach(function(card){var body=card.querySelector('.card-body');if(body&&body.dataset.loaded==='false'){body.dataset.loaded='true';var provider=window._activeProvider||'all';fetch('/partials/sessions?cwd='+encodeURIComponent(card.dataset.cwd)+'&provider='+encodeURIComponent(provider)+_statusQs()).then(function(r){return r.text()}).then(function(html){body.innerHTML=html;if(window.htmx)htmx.process(body)})}})}
function refreshSettings(){var modal=document.getElementById('launcherModal');if(modal&&modal.open)return;var profileModal=document.getElementById('profileModal');if(profileModal&&profileModal.open)return;fetch('/api/settings').then(function(r){return r.json()}).then(function(d){var profileBtn=document.querySelector('.topbar-profile-btn');if(profileBtn&&d.launch_profiles&&d.active_launch_profile){var active=d.launch_profiles.find(function(p){return p.id===d.active_launch_profile});if(active){profileBtn.textContent='\u2699\ufe0f '+active.name}}var peekInput=document.getElementById('peekHotkey');if(peekInput)peekInput.value=d.peek_hotkey||'ctrl+shift+z';var toggle=document.querySelector('.topbar-toggle');if(toggle){if(d.autostart){toggle.classList.add('active')}else{toggle.classList.remove('active')}}_providerSettings=d.provider_settings||{};if(d.default_directory!==undefined)_globalDefaultDirectory=d.default_directory;_launchers=d.custom_launchers||[];var tilesEl=document.getElementById('launcher-tiles');if(tilesEl){fetch('/partials/launchers').then(function(r){return r.text()}).then(function(html){tilesEl.innerHTML=html;if(window.htmx)htmx.process(tilesEl)})}}).catch(function(){})}
document.addEventListener('DOMContentLoaded',function(){document.addEventListener('htmx:afterSwap',function(){loadExpandedCards()});fetch('/api/last-refresh').then(function(r){return r.json()}).then(function(d){if(d.last_refresh)document.getElementById('refreshTime').textContent=d.last_refresh});initProviderFilter();initWorkspaceFilters();
var searchInput=document.querySelector('input[name="q"]');if(searchInput){searchInput.addEventListener('input',debounce(function(e){var q=e.target.value.trim();var provQs=_buildWorkspaceQs();if(!q){refreshCards(false);return}fetch('/search?'+provQs+'&q='+encodeURIComponent(q)).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('workspace-cards');el.innerHTML=html;if(window.htmx)htmx.process(el)});fetch('/partials/all-sessions?page=1&'+_buildWorkspaceQs()+'&q='+encodeURIComponent(q)).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('all-sessions');el.innerHTML=html;if(window.htmx)htmx.process(el)})},300))}
document.addEventListener('visibilitychange',function(){if(!document.hidden){refreshSettings();refreshCards(true);initWorkspaceFilters()}});
});
function _escHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function debounce(fn,delay){var timer;return function(){var ctx=this,args=arguments;clearTimeout(timer);timer=setTimeout(function(){fn.apply(ctx,args)},delay)}}
function loadMoreSessions(page){var btn=document.querySelector('.load-more-btn');if(btn){btn.disabled=true;btn.textContent='Loading...'}var qs=_buildWorkspaceQs();fetch('/partials/all-sessions?page='+page+'&'+qs).then(function(r){return r.text()}).then(function(html){var container=document.getElementById('all-sessions');if(btn)btn.remove();container.insertAdjacentHTML('beforeend',html);if(window.htmx)htmx.process(container);updateActionBar()}).catch(function(){if(btn){btn.disabled=false;btn.textContent='Load more';showToast('<div class="toast toast-error">Failed to load sessions<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')}})}
function initProviderFilter(){fetch('/api/available-providers').then(function(r){return r.json()}).then(function(providers){var container=document.getElementById('providerFilter');if(!providers||providers.length<2){container.style.display='none';return}var html='<button class="provider-filter-btn active" data-provider="all" role="tab" aria-selected="true" onclick="switchProvider(\'all\')">All</button>';providers.forEach(function(p){html+='<button class="provider-filter-btn" data-provider="'+p.name+'" role="tab" aria-selected="false" onclick="switchProvider(\''+p.name+'\')">'+p.display+'</button>'});container.innerHTML=html;container.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){var btns=Array.from(this.querySelectorAll('.provider-filter-btn'));var idx=btns.indexOf(document.activeElement);if(idx<0)return;var next=e.key==='ArrowRight'?(idx+1)%btns.length:(idx-1+btns.length)%btns.length;btns[next].focus();e.preventDefault()}})})}
function switchProvider(provider){window._activeProvider=provider;document.querySelectorAll('.provider-filter-btn').forEach(function(b){b.classList.toggle('active',b.dataset.provider===provider);b.setAttribute('aria-selected',b.dataset.provider===provider?'true':'false')});var qs='?'+_buildWorkspaceQs();fetch('/partials/workspaces'+qs).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('workspace-cards');el.innerHTML=html;if(window.htmx)htmx.process(el);loadExpandedCards();updateActionBar()});fetch('/partials/all-sessions?page=1&'+_buildWorkspaceQs()).then(function(r){return r.text()}).then(function(html){var el=document.getElementById('all-sessions');el.innerHTML=html;if(window.htmx)htmx.process(el);updateActionBar()})}
var _refreshTimer=null;
function startPolling(){if(_refreshTimer)return;var burstCount=0;var burstTimer=setInterval(function(){burstCount++;if(burstCount>=8){clearInterval(burstTimer)}refreshCards(false)},15000);_refreshTimer=setInterval(function(){refreshCards(false)},30000)}
function doRefresh(){var btn=document.querySelector('.refresh-btn');btn.disabled=true;btn.textContent='...';fetch('/api/refresh',{method:'POST'}).then(function(r){return r.json()}).then(function(d){document.getElementById('refreshTime').textContent=d.last_refresh;refreshSettings();refreshCards(true)}).finally(function(){btn.disabled=false;btn.textContent='\u21BB'})}
function initWorkspaceFilters(){return fetch('/api/tags').then(function(r){return r.json()}).then(function(tags){var container=document.getElementById('workspaceFilters');if(!container)return;var hiddenCount=0;tags.forEach(function(t){if(t.name==='hidden')hiddenCount=t.count});var html='<select class="ws-filter-select" id="wsTagFilter" onchange="setTagFilter(this.value)" title="Filter by tag">';html+='<option value="">All tags</option>';if(!tags.length){html+='<option disabled>No tags yet \u2014 use gear on a workspace card to add one.</option>'}tags.forEach(function(t){var eName=_escHtml(t.name);html+='<option value="'+eName+'"'+(t.color?' style="border-left:3px solid '+_escHtml(t.color)+'"':'')+'>'+eName+' ('+t.count+')</option>'});html+='</select>';if(tags.length){html+=' <button class="ws-tag-colors-btn" id="wsTagColorsBtn" onclick="toggleTagColorsPopover()" title="Manage tags" aria-label="Manage tags">&#127991;&#65039;</button>'}html+=' <select class="ws-filter-select" id="wsTimeFilter" onchange="setTimeFilter(this.value)" title="Filter by time">';html+='<option value="">Any time</option>';html+='<option value="today">Today</option>';html+='<option value="yesterday">Yesterday</option>';html+='<option value="this_week">This week</option>';html+='<option value="before">Older</option>';html+='</select>';if(hiddenCount>0){html+=' <span class="ws-hidden-badge" title="'+hiddenCount+' hidden workspace(s)">('+hiddenCount+' hidden)</span>'}html+=' <button class="ws-clear-filters" id="wsClearFilters" onclick="clearWorkspaceFilters()" style="display:none" title="Clear all filters">\u00d7 Clear</button>';container.innerHTML=html;window._tagColorData=tags}).catch(function(){})}
var _tagColorPalette=['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#06b6d4','#3b82f6','#6366f1','#8b5cf6','#d946ef','#ec4899','#64748b'];

ch('/api/launcher/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:l.command,custom_args:l.custom_args||'',cwd:cwd,env:l.env,name:l.name,terminal:l.terminal})}).then(function(r){return r.text()}).then(showToast)}

var _wsTagsPartial=[];
var _wsColorChanged=false;
function openWorkspaceSettings(btn){var card=btn.closest('.workspace-card');var cwd=card.dataset.cwd;var selectedCwds=getSelectedWorkspaceCwds();if(selectedCwds.length>0&&selectedCwds.indexOf(cwd)<0){selectedCwds.push(cwd)}if(selectedCwds.length>1){openBulkWorkspaceSettings(selectedCwds)}else{openSingleWorkspaceSettings(cwd)}}
function openSingleWorkspaceSettings(cwd){fetch('/api/workspace-settings?cwd='+encodeURIComponent(cwd)).then(function(r){return r.json()}).then(function(d){var m=document.getElementById('workspaceSettingsModal');document.getElementById('wsSettingsCwd').value=cwd;document.getElementById('wsSettingsColor').value=d.settings.color||'';_wsAllTags=d.all_tags||[];_wsTags=(d.settings.tags||[]).slice();_wsBulkMode=false;renderWsTags();var info=document.getElementById('wsTagsInfo');if(info)info.style.display='none';document.querySelectorAll('#wsColorPicker .color-swatch').forEach(function(s){s.classList.toggle('selected',s.dataset.color===(d.settings.color||''))});document.getElementById('wsSettingsTitle').textContent='Settings \u2014 '+cwd.split(/[\\/]/).pop();m.showModal();document.getElementById('wsTagsInput').focus()}).catch(function(){showToast('<div class="toast toast-error">Failed to load settings<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')})}
function openBulkWorkspaceSettings(cwds){fetch('/api/workspace-settings-bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cwds:cwds})}).then(function(r){return r.json()}).then(function(d){var m=document.getElementById('workspaceSettingsModal');_wsBulkMode=true;_wsBulkCwds=cwds;_wsTagsToAdd=[];_wsTagsToRemove=[];_wsColorChanged=false;_wsAllTags=d.all_tags||[];var tagCounts={};cwds.forEach(function(c){var ws=d.workspaces[c];if(ws&&ws.tags){ws.tags.forEach(function(t){tagCounts[t]=(tagCounts[t]||0)+1})}});_wsTagsFull=[];_wsTagsPartial=[];Object.keys(tagCounts).forEach(function(t){if(tagCounts[t]===cwds.length){_wsTagsFull.push(t)}else{_wsTagsPartial.push({tag:t,count:tagCounts[t]})}});renderBulkWsTags();var colors=cwds.map(function(c){return(d.workspaces[c]&&d.workspaces[c].color)||''});var allSame=colors.every(function(c){return c===colors[0]});document.getElementById('wsSettingsColor').value=allSame?colors[0]:'';document.querySelectorAll('#wsColorPicker .color-swatch').forEach(function(s){s.classList.toggle('selected',allSame&&s.dataset.color===colors[0])});document.getElementById('wsSettingsTitle').textContent='Settings \u2014 '+cwds.length+' workspaces';m.showModal();document.getElementById('wsTagsInput').focus()}).catch(function(){showToast('<div class="toast toast-error">Failed to load bulk settings<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')})}
function renderBulkWsTags(){var chips=document.getElementById('wsTagsChips');chips.innerHTML='';var container=document.getElementById('wsTagsContainer');var info=document.getElementById('wsTagsInfo');if(!info){info=document.createElement('div');info.id='wsTagsInfo';info.className='ws-tags-info';container.parentNode.insertBefore(info,container)}info.style.display='block';info.innerHTML='<span class="ws-info-line">Filled tags = on all workspaces. Dimmed = on some only.</span><span class="ws-info-line">Changes apply to all '+_wsBulkCwds.length+' selected workspaces.</span>';_wsTagsFull.forEach(function(tag){if(_wsTagsToRemove.indexOf(tag)>=0)return;var chip=document.createElement('span');chip.className='ws-tag-chip ws-tag-full';chip.textContent=tag;var x=document.createElement('button');x.type='button';x.className='ws-tag-remove';x.textContent='\u00d7';x.setAttribute('aria-label','Remove tag '+tag+' from all workspaces');x.onclick=function(){_wsTagsToRemove.push(tag);renderBulkWsTags();document.getElementById('wsTagsInput').focus()};chip.appendChild(x);chips.appendChild(chip)});_wsTagsPartial.forEach(function(item){if(_wsTagsToRemove.indexOf(item.tag)>=0)return;var chip=document.createElement('span');chip.className='ws-tag-chip ws-tag-partial';chip.textContent=item.tag;chip.title='On '+item.count+' of '+_wsBulkCwds.length+' workspaces';chip.setAttribute('aria-label',item.tag+' \u2014 on '+item.count+' of '+_wsBulkCwds.length+' workspaces');var x=document.createElement('button');x.type='button';x.className='ws-tag-remove';x.textContent='\u00d7';x.setAttribute('aria-label','Remove tag '+item.tag+' from all workspaces');x.onclick=function(){_wsTagsToRemove.push(item.tag);renderBulkWsTags();document.getElementById('wsTagsInput').focus()};chip.appendChild(x);chips.appendChild(chip)});_wsTagsToAdd.forEach(function(tag,i){var chip=document.createElement('span');chip.className='ws-tag-chip ws-tag-new';chip.textContent=tag;var x=document.createElement('button');x.type='button';x.className='ws-tag-remove';x.textContent='\u00d7';x.setAttribute('aria-label','Remove tag '+tag+' from all workspaces');x.onclick=function(){_wsTagsToAdd.splice(i,1);renderBulkWsTags();document.getElementById('wsTagsInput').focus()};chip.appendChild(x);chips.appendChild(chip)})}
function renderWsTags(){var chips=document.getElementById('wsTagsChips');chips.innerHTML='';_wsTags.forEach(function(tag,i){var chip=document.createElement('span');chip.className='ws-tag-chip';chip.textContent=tag;var x=document.createElement('button');x.type='button';x.className='ws-tag-remove';x.textContent='\u00d7';x.setAttribute('aria-label','Remove tag '+tag);x.onclick=function(){_wsTags.splice(i,1);renderWsTags();document.getElementById('wsTagsInput').focus()};chip.appendChild(x);chips.appendChild(chip)})}
function addWsTag(tag){tag=tag.trim().replace(/,/g,'');if(!tag||tag.length>64)return;if(_wsBulkMode){if(_wsTagsToAdd.indexOf(tag)>=0)return;if(_wsTagsFull.indexOf(tag)>=0)return;var inPartial=_wsTagsPartial.some(function(p){return p.tag===tag});if(inPartial)return;var rmIdx=_wsTagsToRemove.indexOf(tag);if(rmIdx>=0){_wsTagsToRemove.splice(rmIdx,1)}else{_wsTagsToAdd.push(tag)}renderBulkWsTags();document.getElementById('wsTagsInput').value='';hideWsAutocomplete();return}if(_wsTags.indexOf(tag)>=0)return;if(_wsTags.length>=10){showToast('<div class="toast toast-error">Max 10 tags<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>');return}_wsTags.push(tag);renderWsTags();document.getElementById('wsTagsInput').value='';hideWsAutocomplete()}
function showWsAutocomplete(){var input=document.getElementById('wsTagsInput');var val=input.value.trim().toLowerCase();var ac=document.getElementById('wsTagsAutocomplete');var exclude;if(_wsBulkMode){var partialTags=_wsTagsPartial.map(function(p){return p.tag});exclude=_wsTagsFull.concat(partialTags).concat(_wsTagsToAdd);exclude=exclude.filter(function(t){return _wsTagsToRemove.indexOf(t)<0})}else{exclude=_wsTags}var matches=_wsAllTags.filter(function(t){return exclude.indexOf(t)<0&&(val===''||t.toLowerCase().indexOf(val)>=0)});if(!matches.length){ac.style.display='none';_wsAcIndex=-1;return}ac.innerHTML='';matches.forEach(function(t,i){var div=document.createElement('div');div.className='ws-ac-item';div.textContent=t;div.dataset.index=i;div.onmousedown=function(e){e.preventDefault();addWsTag(t)};ac.appendChild(div)});ac.style.display='block';_wsAcIndex=-1}
function hideWsAutocomplete(){var ac=document.getElementById('wsTagsAutocomplete');ac.style.display='none';_wsAcIndex=-1}
function navigateWsAutocomplete(dir){var ac=document.getElementById('wsTagsAutocomplete');var items=ac.querySelectorAll('.ws-ac-item');if(!items.length)return;items.forEach(function(it){it.classList.remove('highlighted')});_wsAcIndex+=dir;if(_wsAcIndex<0)_wsAcIndex=items.length-1;if(_wsAcIndex>=items.length)_wsAcIndex=0;items[_wsAcIndex].classList.add('highlighted');items[_wsAcIndex].scrollIntoView({block:'nearest'})}
(function(){var input=document.getElementById('wsTagsInput');input.addEventListener('input',function(){showWsAutocomplete()});input.addEventListener('focus',function(){showWsAutocomplete()});input.addEventListener('blur',function(){setTimeout(hideWsAutocomplete,150)});input.addEventListener('keydown',function(e){var ac=document.getElementById('wsTagsAutocomplete');if(e.key==='Enter'||e.key===','){e.preventDefault();if(_wsAcIndex>=0){var items=ac.querySelectorAll('.ws-ac-item');if(items[_wsAcIndex])addWsTag(items[_wsAcIndex].textContent)}else{addWsTag(input.value)}}else if(e.key==='Backspace'&&!input.value&&!_wsBulkMode&&_wsTags.length){_wsTags.pop();renderWsTags()}else if(e.key==='ArrowDown'&&ac.style.display==='block'){e.preventDefault();navigateWsAutocomplete(1)}else if(e.key==='ArrowUp'&&ac.style.display==='block'){e.preventDefault();navigateWsAutocomplete(-1)}else if(e.key==='Escape'){if(ac.style.display==='block'){hideWsAutocomplete();e.stopPropagation()}}})}());
document.getElementById('wsColorPicker').addEventListener('click',function(e){var btn=e.target.closest('.color-swatch');if(!btn)return;var picker=document.getElementById('wsColorPicker');var input=document.getElementById('wsSettingsColor');picker.querySelectorAll('.color-swatch').forEach(function(s){s.classList.remove('selected')});btn.classList.add('selected');input.value=btn.dataset.color;_wsColorChanged=true});
function saveWorkspaceSettings(e){e.preventDefault();if(_wsBulkMode){var payload={cwds:_wsBulkCwds,tags_add:_wsTagsToAdd,tags_remove:_wsTagsToRemove};if(_wsColorChanged){payload.color=document.getElementById('wsSettingsColor').value}fetch('/api/workspace-settings/save-bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.text()}).then(function(t){showToast(t);document.getElementById('workspaceSettingsModal').close();refreshCards(false);initWorkspaceFilters()}).catch(function(){showToast('<div class="toast toast-error">Bulk save failed<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')});return}var cwd=document.getElementById('wsSettingsCwd').value;var color=document.getElementById('wsSettingsColor').value;fetch('/api/workspace-settings/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cwd:cwd,tags:_wsTags,color:color})}).then(function(r){return r.text()}).then(function(t){showToast(t);document.getElementById('workspaceSettingsModal').close();refreshCards(false);initWorkspaceFilters()}).catch(function(){showToast('<div class="toast toast-error">Save failed<button class="toast-dismiss" onclick="this.parentElement.remove()">\u00d7</button></div>')})}
document.getElementById('workspaceSettingsModal').addEventListener('close',function(){_wsBulkMode=false;_wsBulkCwds=[];_wsTagsToAdd=[];_wsTagsToRemove=[];_wsTagsFull=[];_wsTagsPartial=[];_wsColorChanged=false;var info=document.getElementById('wsTagsInfo');if(info)info.style.display='none'});
</script>
{% endblock %}
