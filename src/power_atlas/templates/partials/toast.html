{% if persistent %}<div class="toast toast-{{ level }} toast-persistent" role="alert">{{ message }}<button class="toast-dismiss" aria-label="Dismiss notification" onclick="this.parentElement.remove()">&times;</button></div>{% else %}<div class="toast toast-{{ level }}" role="alert">{{ message }}<button class="toast-dismiss" aria-label="Dismiss notification" onclick="this.parentElement.remove()">&times;</button></div>{% endif %}
